# ============================================================================
# Docker Compose Configuration
# ============================================================================
# Production-ready multi-service orchestration
#
# Quick Start:
#   make up                           # build (with the derived version) + up -d
#   docker compose logs -f fastapi    # View logs
#   docker compose down               # Stop all services (volumes survive)
#   docker compose down -v            # Stop and DELETE the volumes
#
# USE `make up`, NOT `docker compose up`, AND THE REASON IS NOT PREFERENCE. The
# image's version label is derived from oncotriage.__version__ through the
# APP_VERSION build arg below, and a build handed no value FAILS rather than
# stamping a stale number. `make` derives it; a bare `docker compose build`
# prints the one-liner that does the same thing. `docker compose up` on a
# machine that already has the image is unaffected.
#
# Access:
#   - API Docs: http://localhost:8000/docs
#   - Dashboard: http://localhost:8501
#   - Airflow: http://localhost:8080  (user `admin`; the PASSWORD is
#     GENERATED on first start — see THE AIRFLOW CREDENTIALS below)
#   - Qdrant: http://localhost:6333/dashboard
#
# A CLEAN `down -v` + `up` LEAVES THE API `unhealthy`, ON PURPOSE. Five services
# go healthy; `fastapi` reports 503 from GET /health because its Qdrant volume
# was destroyed and an empty index is not something this pipeline will answer
# from — every retrieval against one succeeds and returns nothing, which is
# indistinguishable from a patient who matches no trial. Populate it and the
# container goes green within one probe interval, no restart:
# see "DOCKER CLEAN BRING-UP.md" §5. The MeSH lookups, which used to need a
# hand-typed `docker compose cp`, are seeded from the image on every start.
#
# THE AIRFLOW CREDENTIALS. NO SECRET VALUE LIVES IN THIS FILE ANY MORE, and
# what used to be here was two secrets and one thing that was never a secret at
# all. The full argument is at x-airflow-environment below; the operator-facing
# half is:
#
#   * TWO VARIABLES MUST BE SET BEFORE ANY COMPOSE COMMAND WILL RUN --
#     ONCOTRIAGE_AIRFLOW_SECRET_KEY and ONCOTRIAGE_AIRFLOW_FERNET_KEY. Put
#     them in `03- Code/.env`, beside this file: that is what COMPOSE ITSELF
#     reads for ${...} substitution, it is gitignored, and `.dockerignore`
#     excludes `.env` and `.env.*` so nothing in it is baked into the image.
#     It is NOT the `../05- Keys/.env` mounted at /app/.env — that one is the
#     APPLICATION's credentials file and compose never opens it. Measured, not
#     assumed: with only `../05- Keys/.env` present, compose substitutes
#     nothing. The two variables are documented, with how to generate each and
#     what happens if one is lost, at x-airflow-environment below.
#
#     THERE IS DELIBERATELY NO `.env.example` TO COPY. The obvious name is
#     matched by this project's own `dotenv_file` FILENAME detector
#     (`oncotriage/staging/secrets_scan.py`), so a tracked template would add a
#     permanent third finding to `python s3_stage.py` that only an exclusion
#     manifest entry could clear — and a name chosen to slip past that detector
#     would be a dotenv template disguised from the scanner. The compose file
#     is the one source of truth instead.
#
#   * THE LOGIN PASSWORD IS GENERATED AND IS NOT `admin`. Airflow's
#     SimpleAuthManager writes a random 16-character password per user into
#     {AIRFLOW_HOME}/simple_auth_manager_passwords.json.generated on first
#     start and prints it once to the api-server's stdout. To read it back:
#
#         docker compose exec airflow-webserver \
#             cat /app/airflow_home/simple_auth_manager_passwords.json.generated
#
#     THE HEADER THIS REPLACES WAS WRONG, AND SO WAS THE CORRECTION IT MADE.
#     It said "(admin / admin)" and argued that the pair below "is hardcoded to
#     admin:admin, so the api-server generates no password and there is nothing
#     in its log to look for". Both halves are false, measured against Airflow
#     3.3.0: `simple_auth_manager_users` is a `username:ROLE` list, not a
#     `username:password` pair, so `admin:admin` declares a user named `admin`
#     with the `admin` ROLE and says nothing about any password — and a
#     password IS generated, IS written to that file, and IS printed. The
#     ORIGINAL header ("admin / check api-server logs for password") had been
#     right, and item 21 corrected it into a lie.
#
# WHAT ITEM 21 CHANGED, and why each mattered:
#   1. `version: v5.0.2` removed — not a Compose file-format version, and
#      compose warned that the whole field is obsolete.
#   2. The `trialbridge` network reference on `streamlit` — a network no
#      top-level block declared. THIS ALONE MADE THE PROJECT UNSTARTABLE:
#      compose validates before it does anything, so `docker compose up` failed
#      outright rather than starting four of five services, and `docker compose
#      build` never reached the Dockerfile either. Every other defect in this
#      file and in the Dockerfile was therefore undiscoverable until it was
#      fixed.
#   3. Storage. The container had none — see the `volumes` block at the bottom.
#   4. The `.env` mount pointed at "../04- Keys/" on two of four services, and
#      that directory does not exist.
#   5. One image name for one Dockerfile, and it is now a legal one.
#   6. The DAG is generated. Nothing generated it before.
#   7. `--reload` removed from the API.
#   8. The qdrant healthcheck no longer calls a binary that image does not have,
#      and the airflow-scheduler healthcheck no longer calls `pgrep`, which the
#      application image does not have either. Both probes had been failing
#      100% of the time, and because `fastapi` waits on `qdrant` being HEALTHY,
#      the first of those would have kept the API down on its own.
#   9. `.:/app` removed. It is what made the `.env` mount race and what caused
#      Docker to create a stray empty `.env` in the source directory. See
#      x-app-volumes.
#  10. A SIXTH SERVICE, `airflow-dag-processor`. Airflow 3 parses DAGs in a
#      separate component; without it the DAG is generated, valid, and never
#      registered. See that service for why the failure is invisible.
# ============================================================================

# Explicit project name. Without it compose derives one from the directory name,
# which here is "03- Code" — it sanitises to "03-code", and a leading digit plus
# the renumbering this project does to its directories makes that an unstable
# identity for volumes and networks to hang off.
name: clinical-trial-patient-match


# ============================================================================
# SHARED FRAGMENTS
# ============================================================================
# Anchors, not repetition. The `.env` defect (#4 above) was a two-two split
# across four hand-maintained copies of the same three lines; the copies are
# what made it possible for half of them to be wrong for months without anyone
# noticing. There is one copy of each now.

# ONE image from one Dockerfile, and EXACTLY ONE SERVICE DECLARES THE BUILD.
#
# `fastapi` used to build `trialbridge:latest` while the other three built
# `Clinical-Trial-Patient-Match:latest`, from the same context and the same
# file — two names, two builds, two chances to diverge.
#
# THE OLD NAME WAS ALSO ILLEGAL. A Docker repository name must be lowercase, so
# `Clinical-Trial-Patient-Match:latest` is rejected with "invalid reference
# format" — three of the five services could not have been built under it
# whatever else was fixed. The container_name values keep their original
# capitalisation, which is allowed there.
#
# AND FOUR SERVICES SHARING ONE `build:` DO NOT DEDUPLICATE — they RACE. Giving
# all four the same build section and the same image name (the shape this file
# had, and the shape the fix started as) makes compose run four concurrent
# builds that all try to export to the same tag, and three of them lose:
#
#     target airflow-scheduler: failed to solve:
#     image "docker.io/library/clinical-trial-patient-match:latest": already exists
#
# The image is produced, so it looks like it worked, but `docker compose build`
# exits NON-ZERO — which fails any CI step that checks. Measured, not reasoned:
# it is what the first build of this file did.
#
# So the build section lives on `fastapi` alone and the other three carry only
# the `image:` reference. Compose builds before it creates, so a plain
# `docker compose up` on a machine with no image still works — verified from a
# clean `docker rmi`, not assumed.
x-app-image: &app-image
  image: clinical-trial-patient-match:latest

x-app-environment: &app-environment
  PYTHONUNBUFFERED: "1"
  # oncotriage/paths.py switches to _DOCKER_PATHS on this (or on /.dockerenv).
  DOCKER_CONTAINER: "true"

  # THE CONTAINER USES THE `qdrant` SERVICE BELOW, AND THIS IS WHAT CARRIES IT.
  #
  # `QDRANT_URL: http://qdrant:6333` used to sit on the `fastapi` service and it
  # NEVER DID ANYTHING. Measured inside the running container on 2026-08-06:
  #
  #     os.environ QDRANT_URL before load_env_keys -> http://qdrant:6333
  #     config.get_qdrant_url()                    -> https://bd717e5f-....qdrant.io
  #     os.environ QDRANT_URL after  load_env_keys -> https://bd717e5f-....qdrant.io
  #
  # `paths.load_env_keys()` POPS OPENAI_API_KEY, QDRANT_URL and QDRANT_API_KEY
  # out of os.environ and reloads them from /app/.env with `override=True`. That
  # pop is deliberate — it stops a stale exported credential shadowing the
  # credentials file — so no environment variable could redirect Qdrant, and the
  # `qdrant` service started, went healthy, held zero collections and was
  # queried by nothing while /pipeline/info reported 12,067 trials from the
  # cloud.
  #
  # `ONCOTRIAGE_QDRANT_URL` is the fix and it is a DIFFERENT VARIABLE on
  # purpose. `QDRANT_URL` in the environment is what an accident looks like — a
  # leftover export, a CI runner's inherited variable — and it must still lose
  # to the .env, and it still does: the pop is untouched. This one is
  # project-prefixed, nothing else in any tool's namespace sets it, and
  # `oncotriage/config.py` prints which source answered before the first
  # request. See oncotriage/settings.py:ENV_QDRANT_URL for the full argument.
  #
  # NO `ONCOTRIAGE_QDRANT_API_KEY` HERE, AND THAT IS THE POINT RATHER THAN AN
  # OMISSION. With the URL overridden and no key named, `config` sends NO KEY AT
  # ALL rather than falling back to the .env's — which is a Qdrant Cloud
  # credential, and forwarding it to a host named by an environment variable is
  # credential exfiltration by configuration. The `qdrant` service below sets no
  # QDRANT__SERVICE__API_KEY, so it ignores the header entirely.
  #
  # THE .env IS STILL MOUNTED AND STILL REQUIRED: OPENAI_API_KEY comes from it,
  # and Stage 2's dense channel and Stage 5 both need that.
  #
  # THIS SERVICE'S QDRANT STARTS EMPTY. `docker compose down -v` destroys its
  # volume, and an empty index is not a quiet degradation — Stage 2 now refuses
  # to run against one (oncotriage/agent/readiness.py) and GET /health returns
  # 503 naming it. To populate it, from the host, with the stack up:
  #
  #     ONCOTRIAGE_QDRANT_URL=http://localhost:6333 \
  #         python "11- RAG Trial Indexer.py" --mode direct
  #
  # (`localhost` from the host, `qdrant` from inside the network — the same
  # server either way. `--mode direct` because a staging build plus an alias
  # swap is for a live index that must not blink, and this one is empty.)
  ONCOTRIAGE_QDRANT_URL: http://qdrant:6333

x-app-volumes: &app-volumes
  # THERE IS NO `.:/app` HERE ANY MORE, and removing it was forced by a
  # measurement rather than chosen for tidiness.
  #
  # `.:/app` bind-mounted the host code directory over the whole of /app. The
  # `.env` mount below then has to place a FILE inside that bind mount, and
  # Docker must create the mountpoint to do it. On Docker Desktop it refuses:
  #
  #     error mounting ".../05- Keys/.env" to rootfs at "/app/.env":
  #     create mountpoint for /app/.env mount: mountpoint
  #     "/run/host_virtiofs/.../03- Code/.env" is outside of rootfs
  #
  # and — worse than refusing — for the containers that won the race it did NOT
  # refuse: it CREATED AN EMPTY `.env` IN THE SOURCE DIRECTORY on the host and
  # mounted over that. Observed, both halves: two of five containers failed to
  # start with the error above, and `03- Code/.env` existed afterwards, a
  # zero-byte file Docker had put in the repository. It is gitignored, so it
  # would not have shown up in `git status` either.
  #
  # Three further things `.:/app` cost, each independently sufficient:
  #
  #   * it hid everything the image builds into /app — the entrypoint, the
  #     helper scripts (and `/app/requirements/`, which pass 20f-3 deleted along
#     with `paths.requirements_path`) — which is why those had to be
  #     copied to /usr/local/ to be reachable at all;
  #   * it makes the running code the developer's working tree rather than the
  #     built image, so the artefact is not what was tested;
  #   * its only real consumer was `--reload`, which is gone (see `fastapi`).
  #
  # TO GET DEVELOPMENT MODE BACK, add `- .:/app` to this list and `--reload` to
  # the API command — and expect to create an empty `03- Code/.env` first, or to
  # move the credentials mount out of /app.
  #
  # Credentials. THE SOURCE IS "../05- Keys/", which is the directory that
  # exists; `fastapi` and `airflow-webserver` used to name "../04- Keys/",
  # which does not. The target is unchanged and must not change: the container's
  # `keys_path` is "/app/", so `load_env_keys()` opens exactly /app/.env.
  #
  # `create_host_path: false` is the part that turns this from a fixed typo into
  # a fixed CLASS of defect. Docker's default for a missing bind source is to
  # CREATE IT, as a directory — so the old file did not fail, it silently
  # mounted an empty directory at /app/.env and the failure surfaced much later
  # as a confusing IsADirectoryError. With this flag a missing or misspelled
  # credentials path fails at `up`, naming the path.
  - type: bind
    source: ../05- Keys/.env
    target: /app/.env
    read_only: true
    bind:
      create_host_path: false

  # STORAGE. Before item 21 there was none of this, and `oncotriage/paths.py`
  # points the container at /app/data/, /app/data/inferences.db, /app/results/
  # and /app/checkpoint/ regardless. With `.:/app` covering all of /app, those
  # resolved into the bind-mounted source tree or into nothing at all, and
  # `log_inference` failed on the first request — as a caught, "non-critical"
  # error, so the request still returned 200 and the row was simply lost.
  #
  # NAMED VOLUMES, NOT BIND MOUNTS FROM THE SIBLING DIRECTORIES, and the reason
  # is the acceptance criterion itself: this has to work FROM A CLEAN CHECKOUT.
  # Only "03- Code" is version-controlled. A clean checkout has no "02- Data",
  # no "04- Results" and no "08- Checkpoint" to bind, and a bind mount with a
  # missing source is the exact defect being fixed three lines above. Two
  # further reasons, either of which would be enough on its own:
  #
  #   * the names do not line up. _DOCKER_PATHS wants /app/data/patients/,
  #     /app/data/trials/, /app/data/mesh/; the host tree has "01- Patients",
  #     "02- Trials", "04- MeSH". Mapping them would take a bind mount per
  #     directory, and /app/results/fhir_exploration/ vs "01- FHIR Exploration"
  #     does not map at all.
  #   * `inferences_path` would then be the PRODUCTION inferences.db. Every
  #     container request would write real rows into the real database — the
  #     precise accident CLAUDE.md records for Files 18 and 19, which put six
  #     junk rows into it and were only noticed because they changed which query
  #     File 16 died at. A container writing into it over a single-file bind
  #     mount, with SQLite locking crossing the VM boundary, is worse.
  #
  # The cost is stated rather than hidden: the container starts with an EMPTY
  # corpus and an EMPTY index, so it can answer /health, /pipeline/info and a
  # POST /match end to end, but it retrieves nothing until someone populates the
  # volumes. Getting the real corpus in is a data-loading step, not a
  # compose-file property. Use `docker compose cp` or point
  # ONCOTRIAGE_INFERENCES_DB somewhere else if you want the host's database.
  - app_data:/app/data
  - app_results:/app/results
  - app_checkpoint:/app/checkpoint

  # THE TESTING TREE (the portability pass). `testing_path` and its two
  # subdirectories -- Characterization Fixtures and Evaluation Runs -- became
  # ordinary path variables in this pass; before it, two private globs in
  # oncotriage/fixtures/capture.py and oncotriage/evaluation/run_harness.py
  # resolved them and INVENTED a directory when nothing matched.
  #
  # It gets its own volume rather than a subdirectory of app_data for the
  # reason the host layout keeps them apart: these are OUTPUTS OF PAID RUNS. A
  # capture is twelve real billed end-to-end runs and an evaluation campaign is
  # one Stage 5 call per patient; without a volume both die with the container,
  # and folding them into app_data would tie them to the lifecycle of a corpus
  # that is deliberately `down -v`-able.
  - app_testing:/app/testing

  # MedCPT (836.3 MiB) and the FastEmbed BM25 model (27 KB), cached across
  # restarts -- 876,997,657 bytes in this volume after one cold load, MEASURED
  # in a fresh container. Not the ~110 MB this project repeated from item 21
  # until the portability pass: the checkpoint ships its weights in two formats
  # under two snapshot revisions and one `from_pretrained` pulls both. The
  # argument is at oncotriage/paths.py above `pin_model_cache`, and the
  # Dockerfile's ENV block carries the same figures beside the variables that
  # place them.
  #
  # HF_HOME and FASTEMBED_CACHE_PATH point here (see the Dockerfile). Without
  # this volume every recreated container re-downloads both, on the first
  # request, inside that request.
  - model_cache:/opt/models

x-airflow-environment: &airflow-environment
  AIRFLOW_HOME: /app/airflow_home
  AIRFLOW__CORE__EXECUTOR: SequentialExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////app/airflow_home/airflow.db
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  # NOT A DEFECT AND NOT TO BE TOUCHED. This agrees with the Docker branch of
  # oncotriage/paths.py (airflow_path == "/app/airflow_home/") and with
  # write_dag_file, which writes to `Path(dags_root) / 'dags'`. Checked, not
  # assumed. The real gap in this area was that nothing generated the DAG.
  AIRFLOW__CORE__DAGS_FOLDER: /app/airflow_home/dags
  # ==========================================================================
  # SECRETS. NO VALUE IS WRITTEN IN THIS FILE, AND A MISSING ONE IS LOUD.
  # ==========================================================================
  # Three lines used to sit here under a comment reading "REPORTED, NOT FIXED
  # (belongs to the secrets item): a literal secret key, an empty Fernet key,
  # and a hardcoded admin password". Two of the three were real and the third
  # was never a password at all. Each is dealt with on its own terms below.
  #
  # WHERE THE VALUES COME FROM, AND IT IS NOT THE FILE YOU EXPECT. Compose
  # interpolates ${...} from its own environment plus a `.env` sitting in the
  # PROJECT DIRECTORY -- here, "03- Code/.env", beside this file. It does NOT
  # read "../05- Keys/.env", which is the APPLICATION's credentials file and
  # reaches the container only as the /app/.env bind mount above; nothing in
  # compose ever opens it. The two mechanisms are different files and they are
  # easy to conflate. MEASURED, in a fabricated project layout with both files
  # present: a variable defined only in "../05- Keys/.env" interpolates to
  # nothing, one defined in "03- Code/.env" interpolates, and a shell export
  # beats the file. `.env` is gitignored, and `.dockerignore` excludes `.env`
  # and `.env.*`, so nothing put there is baked into the image.
  #
  # `:?` AND NOT `:-`, AND THE COLON IS LOAD-BEARING. Compose's behaviour for
  # an unset variable with NO default is to WARN and substitute the empty
  # string, exit 0 -- which for a signing key means the stack starts with no
  # key and nothing says so. Three forms, all measured against Compose v5.4.0:
  #
  #     ${VAR}          unset  -> warning, substitutes "",  exit 0   SILENT
  #     ${VAR?msg}      empty  -> substitutes "",           exit 0   SILENT
  #     ${VAR:?msg}     unset  -> error naming VAR and msg, non-zero LOUD
  #     ${VAR:?msg}     empty  -> error naming VAR and msg, non-zero LOUD
  #
  # The `?` form without the colon treats an empty value as supplied, and an
  # empty value is precisely the weak-default case here, so only `:?` will do.
  #
  # THE COST IS STATED RATHER THAN HIDDEN: interpolation runs for EVERY compose
  # subcommand, so with these unset `docker compose down`, `logs` and `ps` fail
  # too, not just `up`. That is the argument for putting the values in
  # "03- Code/.env" rather than exporting them in one shell -- a stack started
  # from a shell that had them cannot be stopped from a shell that does not.
  #
  # THREE ROUTES, AND THE THIRD EXISTS BECAUSE OF `s3_stage.py`. All three
  # were driven; pick by which cost you would rather pay.
  #
  #   a) "03- Code/.env" -- persistent, survives a new shell, one file to
  #      delete. COST: the staging walk covers "03- Code/", the exclusion
  #      manifest excludes "05- Keys/" and not this file, so the secrets
  #      scanner REPORTS it -- twice, on the filename and on the content.
  #      MEASURED: `python s3_stage.py` goes from 1 finding to 3 with a
  #      filled-in one present. That is the scanner working and the refusal is
  #      correct, but it is a refusal an operator has to deal with rather than
  #      a surprise at the end of a 6,700-file scan.
  #
  #   b) `export` in the shell -- nothing on disk, no staging interaction.
  #      COST: per shell, and `docker compose down` from a shell that does not
  #      have them fails.
  #
  #   c) `docker compose --env-file "../05- Keys/airflow-compose.env" ...`
  #      -- persistent AND outside the staged tree, because "05- Keys/" is
  #      already excluded by the manifest. COST: the flag on every compose
  #      command, and forgetting it produces the loud error rather than a
  #      silent one, which is the safe direction.
  #
  # A SYMLINK FROM "03- Code/.env" INTO "05- Keys/" DOES NOT BUY (c). The
  # staging walk still meets a readable file at the "03- Code/.env" path and
  # scans it; the finding moves, it does not go away.

  # 1. THE API SIGNING KEY -- A REAL SECRET, AND THE ONE THE SCANNER CAUGHT.
  #
  # It was a 56-character literal of letters, underscores and hyphens with no
  # digit, ending in the words "change in production". THE VALUE IS DESCRIBED
  # AND NOT REPRODUCED HERE, and that is not squeamishness: quoting it would
  # put the secret straight back into a tracked file, which is not removing it.
  # The first draft of this comment DID quote it and the scanner missed it only
  # because the punctuation around it happens not to form a keyword-colon-value
  # shape -- luck, not design. The same draft quoted it in CLAUDE.md, where the
  # punctuation did form that shape and the scanner reported it.
  # `oncotriage/staging/secrets_scan.py` and `tests/test_staging_exclusions.py`
  # had already settled on describing it; this matches them.
  #
  # THE LITERAL IS STILL IN GIT HISTORY -- one commit carries it -- so it is
  # compromised whatever this file says now, and must never be reused. That
  # exact shape is why `oncotriage/staging/secrets_scan.py` grew
  # `_IDENTIFIER_EXEMPTION_MAX_LENGTH` -- before that cap the value looked like
  # a program identifier to the validator, was exempted, and `scan_bytes` over
  # this file returned ZERO findings. Since the cap landed it has been the only
  # REAL finding blocking a public checkout -- `python s3_stage.py` reported
  # two, and the other is `tests/test_tracking_mlflow_index.py`'s synthetic
  # `_SENTINEL`, which is a fabricated string in a test rather than a
  # credential. With this line gone the staging run reports one.
  #
  # THE VARIABLE IS RENAMED, AND THE OLD NAME WAS DEPRECATED RATHER THAN DEAD.
  # Airflow 3.3.0 has no `[webserver]` section -- the option is `[api]
  # secret_key`. MEASURED: `AIRFLOW__WEBSERVER__SECRET_KEY` still reaches it,
  # through the deprecated-option forwarding, and emits "The secret_key option
  # in [webserver] has been moved to the secret_key option in [api]" on every
  # start. `AIRFLOW__API__SECRET_KEY` sets the same option with no warning.
  #
  # IT IS REQUIRED RATHER THAN OMITTED, and that was measured too. Airflow's
  # default for this option is the template `{SECRET_KEY}`, which resolves to
  # `b64encode(os.urandom(16))` -- A NEW RANDOM VALUE PER PROCESS. Two
  # invocations against one AIRFLOW_HOME with no airflow.cfg produced two
  # different keys. It is persisted into airflow.cfg once `airflow db migrate`
  # has written one, so the container would in practice get a stable key from
  # the volume -- but a key that exists only inside a volume dies with
  # `down -v`, is shared with nobody, and is not something an operator can
  # rotate. Airflow's own documentation for this option is explicit that every
  # instance must use the same value.
  AIRFLOW__API__SECRET_KEY: ${ONCOTRIAGE_AIRFLOW_SECRET_KEY:?is unset - set it in "03- Code/.env" (not 05- Keys/.env, compose cannot read that) or export it}

  # 2. THE FERNET KEY -- AND THE EMPTY STRING WAS WORSE THAN "UNCONFIGURED".
  #
  # Airflow encrypts Connection passwords, Connection `extra` and encrypted
  # Variables with this key. An EMPTY value selects `_NullFernet`, whose
  # `is_encrypted` is False, so values are stored in plaintext.
  #
  # THE EMPTY STRING WAS NOT A NEUTRAL DEFAULT: `airflow db migrate` GENERATES
  # a Fernet key and writes it into {AIRFLOW_HOME}/airflow.cfg when none is
  # configured, and an environment variable beats airflow.cfg. MEASURED: with
  # a good 44-character key sitting in airflow.cfg,
  # `AIRFLOW__CORE__FERNET_KEY=""` makes `conf.get("core","fernet_key")` return
  # `''` and `get_fernet().is_encrypted` False. So the line that used to be
  # here was actively switching OFF encryption Airflow had already configured
  # for itself.
  #
  # INTRODUCING A KEY BREAKS NO EXISTING DATA, and that is measured rather than
  # reasoned. `is_encrypted` is a per-ROW column, so a row written under the
  # null Fernet carries `is_encrypted = 0` and `get_password()` returns it
  # verbatim without consulting any key. Driven end to end against a real
  # Airflow 3.3.0 sqlite metadata database:
  #
  #     store under FERNET_KEY=""  -> password column is plaintext, is_encrypted 0
  #     read it back under a REAL key -> reads fine, still plaintext, still 0
  #     add a new connection under it -> gAAAAAB..., is_encrypted 1
  #
  # SO THE HAZARD IS ROTATION, NOT INTRODUCTION, AND ITS FAILURE MODE IS
  # SILENT. In the same run, reading the ENCRYPTED connection back under a
  # DIFFERENT key reported "Connection not found." -- not a decryption error, an
  # ABSENCE. Losing this key does not announce itself. THIS PROJECT STORES
  # NOTHING ENCRYPTED TODAY (the generated DAG defines no Connection and no
  # Variable, checked), so there is nothing to migrate; that stops being true
  # the first time somebody adds one.
  #
  # Generate one with:
  #     python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  AIRFLOW__CORE__FERNET_KEY: ${ONCOTRIAGE_AIRFLOW_FERNET_KEY:?is unset - set it in "03- Code/.env" (not 05- Keys/.env, compose cannot read that) or export it}

  # 3. THE USER LIST -- NOT A CREDENTIAL, AND IT DELIBERATELY STAYS A LITERAL.
  #
  # `simple_auth_manager_users` is a comma-separated list of `username:ROLE`,
  # where role is one of viewer/user/op/admin. `admin:admin` is a user named
  # `admin` holding the `admin` role. IT CONTAINS NO PASSWORD. Airflow 3.3.0's
  # own default for the option is the identical string, so deleting this line
  # would change nothing at all.
  #
  # AND THE PASSWORD FILE IS ALREADY GENERATED, WHICH SETTLES THE ONE QUESTION
  # THAT LOOKED OPEN. MEASURED by running SimpleAuthManager.init() with exactly
  # this value: it writes a random 16-character password per user into
  # {AIRFLOW_HOME}/simple_auth_manager_passwords.json.generated and prints it
  # once. That file is what `oncotriage/orchestration/airflow_manager.py` reads
  # as tier 4 of its four-tier password route, and it is already excluded from
  # S3 staging by path and caught by the filename detector. So tier 4 works
  # today and needed nothing done to it.
  #
  # IT IS KEPT RATHER THAN DELETED for one reason: written down, an upstream
  # change to Airflow's default cannot silently change who can log in here.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin


services:

  # ==========================================================================
  # QDRANT - Vector Database
  # ==========================================================================
  qdrant:
    # Must match the server holding the index (v1.18.3). A different tag here
    # would start a different server than the one the collection was built on.
    image: qdrant/qdrant:v1.18.3
    container_name: Clinical-Trial-Patient-Match-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: INFO
    # THIS IMAGE HAS NEITHER wget NOR curl. Measured, not assumed:
    #   docker run --rm --entrypoint sh qdrant/qdrant:v1.18.3 \
    #       -c 'command -v wget curl'
    # prints nothing. The old healthcheck invoked `wget`, so it could never
    # succeed — qdrant would have sat in `starting` until it went `unhealthy`,
    # and `fastapi` waits on `condition: service_healthy`, so THE API WOULD
    # NEVER HAVE STARTED even after every other defect here was fixed.
    #
    # bash IS present, so the probe is written in bash alone: open a TCP socket
    # to the REST port, send a real HTTP request, and require "200" in the
    # status line. That is a stronger check than a port probe — it proves the
    # HTTP server is answering, not merely that something is listening.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 || exit 1; printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 || exit 1; read -r line <&3 || exit 1; case "$$line" in *200*) exit 0;; *) exit 1;; esac'
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - Clinical-Trial-Patient-Match


  # ==========================================================================
  # FASTAPI - Clinical Trial Matching API
  # ==========================================================================
  fastapi:
    # THE ONLY SERVICE WITH A BUILD SECTION. See the x-app-image comment above:
    # four services sharing one build section race on the image export and make
    # `docker compose build` exit non-zero.
    <<: *app-image
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # THE IMAGE'S VERSION LABEL, DERIVED. `oncotriage/__init__.py` is the
        # single declaration of this project's version; a Dockerfile LABEL
        # cannot read a Python attribute, so it arrives as this ARG and a
        # `RUN --check` in STAGE 2 fails the build if it disagrees with the
        # source that was copied in.
        #
        # `:-unset` is NOT a default version — it is a sentinel the guard
        # rejects. A bare `docker compose build` therefore FAILS with a message
        # naming `make build`, which is the trade this closure cost and is
        # argued at the ARG in the Dockerfile. The Makefile derives the value
        # with docker/app_version.py; so does the one-liner the guard prints.
        APP_VERSION: ${ONCOTRIAGE_APP_VERSION:-unset}
    container_name: Clinical-Trial-Patient-Match-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes: *app-volumes
    environment: *app-environment
    working_dir: /app
    # NO SHELL AND NO QUOTING PROBLEM. The old command wrapped everything in
    # `bash -c '...'` to survive the space in the filename; an argument vector
    # has no such problem, and the entrypoint `exec`s it directly.
    #
    # `--reload` IS GONE. Three reasons, in order of weight:
    #   * the file's own header calls this stack production-ready, and an
    #     auto-reloading API is not that;
    #   * the reloader watches the whole of /app, which `.:/app` makes the
    #     entire source tree, so any editor write — including a .pyc, a
    #     scratch file, or a test writing beside the code — restarts the API
    #     mid-request;
    #   * a restart re-runs the lifespan handler, which recompiles the LangGraph
    #     pipeline. Cheap today only because models are lazy; the first
    #     retrieval after every restart re-pays for MedCPT and FastEmbed.
    # Reinstate it deliberately for development, not by default.
    #
    # ONE THING `--reload` DOES *NOT* COST, measured rather than repeated: it
    # does not load the app twice. The obvious worry is that the reloader parent
    # and its child both import the application and both compile the graph. They
    # do not. Running this image with `--reload` and counting:
    #
    #     processes                     -> 3 (supervisor, resource tracker, one
    #                                          spawned server child)
    #     "[Rate Limiting]" banners     -> 1   (create_app ran once)
    #     "Compiling LangGraph pipeline"-> 1   (lifespan ran once)
    #
    # uvicorn's supervisor only resolves the `module:attribute` STRING; the
    # child is what imports it. So that particular argument for removing
    # `--reload` would have been wrong, and the three above are the real ones.
    #
    # The module name is still "17- FastAPI Server", not the package path. That
    # is deliberate: File 17 documents that it keeps `app` at module level
    # BECAUSE this line imports it, and `uvicorn oncotriage.api.server:app`
    # reaches the identical object if you prefer it.
    command:
      - uvicorn
      - "17- FastAPI Server:app"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      # 15s was optimistic: startup imports torch, transformers and langgraph
      # before the lifespan handler compiles the graph.
      start_period: 90s
    # ======================================================================
    # THE SHUTDOWN GRACE PERIOD, AND THE ARITHMETIC BEHIND THE NUMBER
    # ======================================================================
    # DOCKER'S DEFAULT IS 10 SECONDS. `docker stop` sends SIGTERM, waits that
    # long, then SIGKILLs. A container SIGKILLed mid-request abandons an
    # in-flight Stage 5 call that has ALREADY BEEN BILLED, writes no inference
    # row for it, and leaves nothing in the database saying it happened -- so
    # ten seconds is not a grace period for this service, it is a guarantee of
    # loss under any orderly restart.
    #
    # WHAT ONE IN-FLIGHT STAGE 5 CALL CAN COST, from the shipped constants:
    #
    #     MATCHING_REQUEST_TIMEOUT_SECONDS  = 300   (oncotriage/config.py)
    #     OPENAI_SDK_MAX_RETRIES            = 1
    #     one call, worst case              = 300 x (1 + 1) = 600 s
    #
    # Plus the crash record: the health flush, both console blocks and the
    # finalized `runs` row, which are database writes measured in
    # milliseconds. 620s is 600 + 20 of margin for those.
    #
    # ONE IN-FLIGHT CALL IS WHAT 620s BUYS, AND SINCE THIS SERVICE GAINED A
    # SHUTDOWN GATE THAT IS ALSO WHAT A `docker stop` ON IT COSTS. Two numbers
    # follow: what the drain WAS with no gate, and what it IS with one. The
    # value 620 did not move, and that is the point -- the gate brought the
    # worst case down to the number this grace period was always derived from.
    #
    # ===================== BEFORE THE GATE (the shortfall) ==================
    # This comment recorded a KNOWN, UNFIXED shortfall here, arm-independent,
    # and it was right. It is kept as the record of what the gate removed.
    #
    # THE SHIPPED ARM IS PER-TRIAL (`MATCHING_PER_TRIAL_CALLS_ENABLED` is
    # True):
    #
    #     rounds per patient = ceil(MAX_TRIALS_FOR_EVALUATION / parallel)
    #                        = ceil(15 / 4) = 4
    #     worst case         = 4 x 600 = 2400 s = 40 minutes
    #
    # So a `docker stop` on this service could SIGKILL it with up to THREE
    # further full-price rounds still to be issued.
    #
    # THE RETAINED GROUPED ARM IS THE SAME NUMBER, WHICH IS WHY THE FLIP DID
    # NOT MOVE THIS VALUE. Grouped mode is one request per *CHUNK*, not per
    # patient: the packer splits a patient's trials against the input-token
    # budget, so the number of sequential requests depends on how long the
    # trials' eligibility text is. Driven through the real Stage 5 node with a
    # stub client at MAX_TRIALS_FOR_EVALUATION = 15 (the operator-control
    # pass; no billed call):
    #
    #     criteria chars/trial   1000  2000  4000  6000  8000  12000
    #     chunks per patient        1     2     3     4     5      5
    #
    #     worst case         = 4 further requests x 600 = 2400 s
    #
    # SO THE SHORTFALL WAS ARM-INDEPENDENT, and 620 s was never sufficient for
    # an UNGATED patient in either arm. Raising it to 2400 s was rejected then
    # and is still the wrong repair: the fix is a gate, and this service now
    # has one.
    #
    # ====================== AFTER THE GATE (what is true) ===================
    # `oncotriage/api/server.py` arms a Stage 5 shutdown gate in its lifespan
    # STARTUP -- a SIGNAL handler chained onto uvicorn's own -- so a SIGTERM
    # sets the flag in the handler frame, and Stage 5 issues no further
    # request in EITHER arm. What is left to wait for is the round already in
    # the air:
    #
    #     worst case = 1 in-flight round x 600 = 600 s, + 20 margin = 620 s
    #
    # CONCURRENT REQUESTS DO NOT MULTIPLY IT. Unlike the batch runner, this
    # service can hold several patients at once -- each on its own thread of
    # the event loop's pool -- but their in-flight rounds run CONCURRENTLY, so
    # the wall time is still one round rather than one per request.
    #
    # A LIFESPAN SHUTDOWN HOOK ALONE WOULD HAVE BOUGHT NOTHING, and that is
    # measured rather than argued: uvicorn's `Server.shutdown()` awaits
    # `_wait_tasks_to_complete()` BEFORE it delivers the lifespan shutdown
    # event, so a hook there fires after the drain it was meant to bound --
    # and not at all under `force_exit`. Driven against a real uvicorn with a
    # real SIGTERM and a request genuinely in flight: with the signal gate the
    # flag flipped 0.012 s after the signal, mid-request; with the lifespan
    # hook alone the in-flight request never saw it at all.
    #
    # THE BATCH RUNNER IS COVERED TOO, AND AS OF THE OPERATOR-CONTROL PASS IT
    # IS COVERED IN BOTH ARMS -- which is what this comment already claimed and
    # what was, until that pass, true only of per-trial mode. Its SIGTERM handler asks Stage 5 to stop issuing
    # requests; the flag gated the per-trial WAVE and nothing else, so a
    # grouped patient carried on sending every remaining chunk. Measured, both
    # arms, at 15 trials of 8000 characters: 4 further requests before the gate
    # existed and 0 after it, with the patient failing honestly rather than
    # being published as a success a resume would then skip forever. See
    # `_obtain` in oncotriage/agent/evaluation.py, and THE STAGE 5 SHUTDOWN
    # FLAG above `request_stage5_shutdown` for why the wave's own
    # `cancel_futures=True` cannot do this from a real signal.
    #
    # `26- Ablation Study.py` HAS THE SAME GATE as of that pass, for the same
    # reason: it is also not a compose service, and an operator running it
    # under systemd needs TimeoutStopSec=620 exactly as the batch runner does.
    #
    # THE COST OF THE NUMBER IS STATED: a container that is genuinely wedged
    # now takes up to 620 s to die rather than 10. That is the trade for not
    # abandoning paid work, and an operator who wants the old behaviour has
    # `docker kill`.
    #
    # NOT SET ON `streamlit`, `qdrant` OR THE THREE AIRFLOW SERVICES: none of
    # them holds an in-flight billed request, so the default is right for
    # them and a blanket value would slow every restart for nothing.
    #
    # THE BATCH RUNNER IS NOT A COMPOSE SERVICE, so nothing here reaches it.
    # An operator running `25- Batch Runner.py` under systemd or `docker run`
    # needs the same allowance -- TimeoutStopSec=620 -- for the same reason.
    stop_grace_period: 620s
    networks:
      - Clinical-Trial-Patient-Match


  # ==========================================================================
  # STREAMLIT - Monitoring Dashboard
  # ==========================================================================
  streamlit:
    <<: *app-image
    container_name: Clinical-Trial-Patient-Match-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes: *app-volumes
    environment: *app-environment
    working_dir: /app
    command:
      - streamlit
      - run
      - 21- Streamlit Dashboard.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - Clinical-Trial-Patient-Match


  # ==========================================================================
  # AIRFLOW WEBSERVER - Trial Refresh UI
  # ==========================================================================
  # ALSO THE INITIALISER. It migrates the metadata database and generates the
  # DAG before serving, and the scheduler waits for it to report healthy, so
  # both of those have happened before anything parses the dags folder. That is
  # what removed the scheduler's `sleep 30` — a fixed sleep is a race with a
  # comfortable margin, not an ordering.
  airflow-webserver:
    <<: *app-image
    container_name: Clinical-Trial-Patient-Match-airflow-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Same set as x-app-volumes, plus airflow_home. Written out rather than
      # merged because YAML cannot append to an aliased sequence.
      - type: bind
        source: ../05- Keys/.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - app_data:/app/data
      - app_results:/app/results
      - app_checkpoint:/app/checkpoint
      - model_cache:/opt/models
      # Airflow needs persistent database, logs and dags
      - airflow_db:/app/airflow_home
    environment:
      <<: [*app-environment, *airflow-environment]
    working_dir: /app
    # `mkdir -p /app/airflow_home/dags` is gone from here: write_dag_file
    # creates the directory itself (`dag_dir.mkdir(parents=True,
    # exist_ok=True)`), and the entrypoint has already created
    # /app/airflow_home/ from oncotriage/paths.py's own table.
    #
    # THE GENERATION STEP IS THE FIX FOR DEFECT 7. Nothing in the container ever
    # ran it, so the dags folder was created empty and the scheduler parsed an
    # empty directory forever. See docker/generate_dag.py for what it does on a
    # second `up` and on an `up` after the generator changes — it is idempotent,
    # and it replaces a stale DAG loudly instead of leaving the scheduler
    # running the old one.
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        python /usr/local/lib/oncotriage-docker/generate_dag.py &&
        exec airflow api-server --port 8080
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - Clinical-Trial-Patient-Match


  # ==========================================================================
  # AIRFLOW DAG PROCESSOR - Parses the dags folder into the metadata database
  # ==========================================================================
  # NEW IN ITEM 21, AND THE STACK CANNOT RUN A DAG WITHOUT IT.
  #
  # In Airflow 2 the scheduler parsed the dags folder itself. In Airflow 3 —
  # which is what `pyproject.toml` pins (`requirements.txt` before pass 20f-2
  # merged the two lists) and what `airflow api-server` in the
  # webserver command implies — DAG PARSING IS A SEPARATE COMPONENT, and there
  # is no in-scheduler mode to fall back to (`airflow config get-value scheduler
  # standalone_dag_processor` returns nothing in 3.1.7: the option is gone
  # because the behaviour is no longer optional).
  #
  # THE SYMPTOM IS PARTICULARLY BAD, which is why this is called out rather than
  # quietly added. With the DAG generated and the scheduler running:
  #
  #     airflow dags list-import-errors  ->  No data found     (looks fine)
  #     airflow tasks list trial_refresh_weekly
  #                                      ->  scrape_and_save, rebuild_index,
  #                                          verify_index      (looks fine!)
  #     airflow dags list                ->  No data found     (it is NOT there)
  #
  # `tasks list` reads the DAG file directly, so it succeeds and makes the DAG
  # look registered. Only `dags list`, which reads the metadata database, tells
  # the truth. The webserver's own /api/v2/monitor/health said so too, in a
  # field easy to skim past: "dag_processor": {"status": null}.
  #
  # So without this service the stack comes up entirely healthy, the UI works,
  # the DAG file is present and valid, and the DAG never runs and never appears.
  airflow-dag-processor:
    <<: *app-image
    container_name: Clinical-Trial-Patient-Match-airflow-dag-processor
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../05- Keys/.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - app_data:/app/data
      - app_results:/app/results
      - app_checkpoint:/app/checkpoint
      - model_cache:/opt/models
      - airflow_db:/app/airflow_home
    environment:
      <<: [*app-environment, *airflow-environment]
    working_dir: /app
    command: ["airflow", "dag-processor"]
    depends_on:
      # Same reason as the scheduler: the webserver migrates the database and
      # writes the DAG, and this component reads both.
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    networks:
      - Clinical-Trial-Patient-Match


  # ==========================================================================
  # AIRFLOW SCHEDULER - Background Task Execution
  # ==========================================================================
  airflow-scheduler:
    <<: *app-image
    container_name: Clinical-Trial-Patient-Match-airflow-scheduler
    restart: unless-stopped
    volumes:
      # Same set as x-app-volumes, plus airflow_home. Written out rather than
      # merged because YAML cannot append to an aliased sequence.
      - type: bind
        source: ../05- Keys/.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - app_data:/app/data
      - app_results:/app/results
      - app_checkpoint:/app/checkpoint
      - model_cache:/opt/models
      # Share same Airflow DB with webserver
      - airflow_db:/app/airflow_home
    environment:
      <<: [*app-environment, *airflow-environment]
    working_dir: /app
    command: ["airflow", "scheduler"]
    depends_on:
      # service_healthy, not service_started. The webserver runs `db migrate`
      # and generates the DAG; starting the scheduler before those finish is a
      # scheduler that parses an empty folder and a second process migrating the
      # same SQLite file. The old file used service_started plus `sleep 30`.
      airflow-webserver:
        condition: service_healthy
    # `pgrep -f 'airflow scheduler'` WAS THE OLD PROBE AND THIS IMAGE HAS NO
    # pgrep — python:3.11-slim ships no procps, measured. So the scheduler could
    # never report healthy either. procps is installed now (it is worth having
    # in a container you may need to debug), but the probe asks Airflow instead:
    # `airflow jobs check` consults the job table, so it answers "is the
    # scheduler doing its job" rather than "does a process with this name
    # exist".
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    networks:
      - Clinical-Trial-Patient-Match


# ============================================================================
# NETWORKS
# ============================================================================
# ONE network. `streamlit` used to ask for `trialbridge`, which nothing here
# declares — see defect 2 in the header for why that made the whole project
# unstartable rather than breaking one service.
networks:
  Clinical-Trial-Patient-Match:
    driver: bridge
    name: Clinical-Trial-Patient-Match-network


# ============================================================================
# VOLUMES - Persistent Data Storage
# ============================================================================
# app_data, app_results and app_checkpoint are new in item 21. Without them the
# container had nowhere to put anything: see the long comment on x-app-volumes.
#
# They survive `docker compose down` and are removed by `docker compose down -v`.
# That is what makes "a request writes a row and the row is still there
# afterwards" true across a restart, and it is also why docker/generate_dag.py
# has to cope with a dags directory that already has a file in it.
volumes:
  qdrant_storage:
    name: Clinical-Trial-Patient-Match-qdrant-data
  airflow_db:
    name: Clinical-Trial-Patient-Match-airflow-db
  app_data:
    name: Clinical-Trial-Patient-Match-app-data
  app_results:
    name: Clinical-Trial-Patient-Match-app-results
  app_checkpoint:
    name: Clinical-Trial-Patient-Match-app-checkpoint
  app_testing:
    name: Clinical-Trial-Patient-Match-app-testing
  model_cache:
    name: Clinical-Trial-Patient-Match-model-cache
