# OncoTriage Agent — Continuous Integration
###########################################
#
# WHAT RUNS HERE, AND WHAT DELIBERATELY DOES NOT
# ----------------------------------------------
# Buckets A and B only. The classification, the evidence for each entry and the
# reason every excluded file is excluded live in
# `.github/scripts/ci_test_buckets.py`; `--check` fails when a test file under
# tests/ is not in it, so a new file becomes a NAMED failure here rather than a
# file that silently never runs.
#
# NOT RUN, ON PURPOSE:
#   * fixture_replay.py — it refuses unless the LIVE Qdrant collection digest
#     matches what the twelve fixtures were captured against. That is a machine
#     with a real index, not a runner, and standing an index up here would be
#     inventing the thing under test.
#   * Files 18 and 19, fixture_capture.py, File 13 armed — every POST is a
#     billed Stage 5 call at $0.13–$0.17 per patient.
#   * Everything needing the corpus, the UMLS Metathesaurus, the production
#     inference database or the UMLS-derived MeSH crosswalks.
#
# THE PYTHON VERSION IS THE CONTAINER'S, NOT THE DEVELOPER'S. The Dockerfile
# pins `python:3.11-slim@sha256:94c50be2…`, verified by running the built image
# to report 3.11.15. The development machine is on 3.13. That gap is not
# hypothetical here: the Dockerfile's own header records this project shipping a
# base image two minor versions from what its tag claimed, found only by running
# it.
#
# FOUR THINGS THAT WOULD OTHERWISE COST A DEBUGGING CYCLE, each handled below:
#   1. fetch-depth: 0 — several tests lift control implementations out of git
#      history and the secret scan reads every commit.
#   2. Bucket B goes through `make serial-tests` and nothing else: two members
#      rewrite source in place and restore it, the order is derived, and the
#      runner holds an flock. It also runs in a separate STEP after bucket A,
#      never beside it.
#   3. The image goes through `make build`, never `docker compose build`. The
#      version label is derived by the Makefile and a `RUN --check` inside the
#      build refuses an ARG that disagrees with `oncotriage/__init__.py`.
#   4. Only `03- Code/` is version-controlled, and every data path is resolved
#      by GLOB against the repository's PARENT. `_glob_one` raises when nothing
#      matches, so a bare checkout cannot resolve a single path variable and 22
#      of 27 non-serial test files die before their first check. The checkout
#      therefore lands in a directory named to match the `*Code/` glob and
#      `provision_ci_paths.py` creates the sibling skeleton beside it.
#
# THE CHECKOUT DIRECTORY NAME IS LOAD-BEARING AND IS WRITTEN OUT IN FULL, not
# carried in a workflow-level `env`. The `env` context is not available in every
# workflow key — `jobs.<id>.defaults.run.working-directory` is the one that
# bites — and a path that silently resolves to an empty string puts the checkout
# at the workspace root, where `*Code/` matches nothing and every job fails with
# a glob error instead of a missing-variable error.
#
# THE SECURITY GATES ARE GREEN, AND GREEN DOES NOT MEAN CLEAN. Each of the
# three gates fails on what is ACTIONABLE HERE and prints everything else:
#
#   pip-audit  fails on a fixable finding that is not in the per-id accepted
#              table in .github/scripts/audit_gate.py. 26 accepted, 4 unfixable,
#              all printed on every run. It was 32 until the Airflow upgrade
#              released fastapi from `starlette<0.49.0`; those six starlette
#              entries are deleted because they are FIXED, and the gate's own
#              staleness check would have failed on them otherwise.
#   Trivy      fails on a fixable HIGH/CRITICAL that is not in `.trivyignore`.
#              A second, non-gating step prints every severity including the
#              unfixable ones, and writes them as JSON. A third step reads that
#              JSON and fails when an accepted `.trivyignore` id has STOPPED
#              appearing — the staleness check pip-audit's gate already had,
#              which matters most for the BASE-LAG entries, whose whole point is
#              that they expire.
#   gitleaks   fails on any finding not fingerprinted in `.gitleaksignore`,
#              which holds exactly one entry, argued.
#
# EVERY ACCEPTED ENTRY IS ONE ID WITH ONE REASON. There is no rule-level,
# package-level or path-level suppression anywhere in this pipeline, so a NEW
# advisory against an already-accepted package still turns a gate red.
#
# THERE ARE NO CRITICAL FINDINGS IN THIS IMAGE'S PYTHON PACKAGES ANY MORE.
# There were two, both apache-airflow 3.1.7 (CVE-2025-57735, CVE-2026-42252),
# and they are FIXED by the upgrade to 3.3.0 rather than accepted. Measured on
# the built image with Trivy 0.73.0, the FULL non-gating scan, before -> after:
#
#     Python (python-pkg)    66 findings (2 CRITICAL, 29 HIGH)  ->  29 (0, 17)
#     debian  (os-pkgs)     208 findings (4 CRITICAL, 27 HIGH)  -> 208 (4, 27)
#
# The four OS CRITICALs are perl-base and Debian has published no fix for any of
# them, which is exactly why the gate is `--ignore-unfixed`. The OS row does not
# move because nothing in this pass touched the base image; the Dockerfile's
# FROM lines say how Debian patches are taken (by re-pinning the digest).
#
# WHAT IS ACCEPTED AND NOT FIXED, in one place — every entry a HIGH, none a
# CRITICAL:
#   pillow 11.3.0          13 HIGHs. Fixes are all 12.x; streamlit 1.46.0 and
#                          fastembed 0.7.4 both cap `pillow<12`.
#   transformers 4.57.1    two HIGHs, fixed in 5.x. It loads the MedCPT
#                          cross-encoder that Stage 3's ranking depends on.
#   setuptools / msgpack   two HIGHs, in copies VENDORED INSIDE pip. Neither is
#                          separately installable and neither is what this
#                          project imports; argued in `.trivyignore`.
#
# starlette IS NO LONGER ON THAT LIST, and it was not dropped — it was fixed.
# Its three ids were accepted because `fastapi==0.117.1` declared
# `starlette<0.49.0`. apache-airflow-core 3.3.0 requires `fastapi>=0.129.0`, so
# the Airflow upgrade forced fastapi to 0.136.3 and starlette to 1.6.0, past
# every one of those fix versions. The same move deleted six starlette entries
# from the pip-audit gate's accepted table.
#
# tests/test_package_invariants.py IS STILL NOT RUN HERE, and one of its two
# blockers is now gone. Measured on Linux, x86-equivalent conditions (a
# container with /.dockerenv removed and DOCKER_CONTAINER=false, so
# oncotriage.paths takes the same branch a runner does):
#
#     before this pass   234 passed /  6 failed / (no skip mechanism)
#     after              245 passed /  2 failed / 2 skipped
#
# CLOSED — caffeine. It hardcoded `import caffeine` in both trap preambles.
# The package is macOS-only (its module body spawns the `caffeinate` binary),
# so on Linux the preamble raised and took four checks and two probes with it.
# pyproject now declares it `sys_platform == "darwin"` and the two preambles
# guard the import, recording a SKIP — never a pass — for the one thing that
# genuinely cannot be covered where the package is absent.
#
# STILL OPEN — the FALLBACK root, 2 failures, and they are an assumption about
# the developer's machine rather than a defect in the package. Check 2b proves
# that reading a path RAISES when the project root is unreachable, then proves
# the raise was not vacuous by restoring the root and requiring the same read to
# succeed. It restores it by UNSETTING ONCOTRIAGE_MAIN_PATH so that
# settings.FALLBACK_MAIN_PATH applies — a hardcoded absolute path that exists on
# exactly one machine. On a runner nothing is restored, the read raises again,
# and the two non-degeneracy assertions fail. The package is behaving correctly
# throughout: it raises, and the message names the variable to set.
#
# IT IS NOT ADDED TO CI UNTIL THAT IS ZERO. A structural guard that is allowed
# in with two known failures is a guard nobody will look at again, and the fix
# is not to relax it — it is to give the second probe a root that exists
# anywhere, which this workflow already builds (provision_ci_paths.py). That is
# a change to the guard itself and belongs in its own reviewed commit, with the
# usual break-it-and-watch-it-fail demonstration. See the CI report.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # On demand, so a run can be repeated against an unchanged commit — which is
  # how the cached-install figure in the CI report was measured, and how an
  # operator re-runs after provisioning the serial suite's inputs on a runner
  # that has them.
  workflow_dispatch:

# A superseded run on the same branch is cancelled. Keyed on `github.ref` rather
# than `github.sha` so a force-push or a fast follow-up kills the older run;
# `github.workflow` keeps push and pull_request runs in separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Nothing here writes to the repository, opens a pull request
# or publishes a package, and no job pushes the image it builds.
permissions:
  contents: read

jobs:

  # =========================================================================
  # TESTS — buckets A and B, in that order, in separate steps
  # =========================================================================
  tests:
    name: tests (buckets A and B)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: '03- Code'

    steps:
      - name: Check out into a directory matching the *Code/ glob
        uses: actions/checkout@v5
        with:
          path: '03- Code'
          # REQUIRED. tests/test_storage_query_layer.py and
          # tests/test_indexer_admission_filters.py derive a revision and lift
          # their negative controls out of `git show`; in a tree without history
          # they crash rather than failing cleanly. Measured: bucket A reports
          # identical counts at depth 1 and at full depth today, so for the
          # tests this is insurance against the next control added — but the
          # secret scan requires it outright.
          fetch-depth: 0

      - name: Set up Python 3.11 (the container's version)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Reclaim runner disk before install
        # MEASURED, NOT PRECAUTIONARY. `torch==2.9.0`'s x86_64 wheel is 900 MB
        # and pulls 15 `nvidia-*` CUDA packages totalling 2,988 MB — ~3.9 GB of
        # downloads, against 104 MB for the same pin on arm64. Installed, the
        # dependency set is ~2 GB on arm64 (measured in the built image) and
        # several times that on x86_64. A hosted runner starts with roughly
        # 14 GB free, and pip failing on ENOSPC surfaces as a wheel error that
        # reads like a dependency problem.
        #
        # This removes preinstalled toolchains this project never uses. It
        # changes no dependency and no pin — trimming the dependency set is a
        # decision about what the project resolves to, and is not made here.
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup || true
          df -h / | tail -1

      - name: Record the interpreter
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install (make install)
        run: make install

      - name: Disk after install
        run: df -h / | tail -1

      - name: Provision the sibling data-directory skeleton
        # Directories only, plus the two MeSH lookups this repository already
        # vendors at docker/mesh-core/ with a sha256 manifest. No patient data,
        # no trial corpus, no inference database and no credential is created.
        run: python .github/scripts/provision_ci_paths.py --root "$GITHUB_WORKSPACE"

      - name: Check the test classification is complete
        # Fails when a tests/test_*.py is unclassified, and when bucket B here
        # disagrees with tests/run_serial_tests.py's collision matrix.
        run: python .github/scripts/ci_test_buckets.py --check

      - name: Static checks (syntax gate on Python 3.11)
        # There is no linter or type-checker configuration in this repository —
        # pyproject.toml has only [build-system], [project] and
        # [tool.setuptools*], and there is no setup.cfg, tox.ini, .flake8,
        # ruff.toml or mypy.ini. This step compiles every file on the
        # container's interpreter and prints, in its own output, exactly what it
        # does not check.
        run: python .github/scripts/static_checks.py

      - name: Bucket A — parallel-safe tests
        env:
          ONCOTRIAGE_MAIN_PATH: ${{ github.workspace }}
        run: python .github/scripts/ci_test_buckets.py --run A

      - name: Bucket B — serial preconditions
        id: serial
        # `always()` because a bucket A failure must not silently cancel bucket
        # B and the dependency audit below. Without it a single red test in
        # bucket A skips every later step, and the pipeline reports one problem
        # while hiding two — including a security scan. The job's conclusion is
        # unaffected: a failed step still fails the job.
        if: always()
        env:
          ONCOTRIAGE_MAIN_PATH: ${{ github.workspace }}
        # The report goes to RUNNER_TEMP, never into the checkout: bucket B's
        # last member copytree()s the package and scans the tree, and a stray
        # file dropped in by the harness is the kind of thing that turns into a
        # mystery failure.
        run: |
          python .github/scripts/ci_test_buckets.py --serial-preconditions \
            | tee "$RUNNER_TEMP/serial-preconditions.txt"
          grep '^serial_ready=' "$RUNNER_TEMP/serial-preconditions.txt" >> "$GITHUB_OUTPUT"

      - name: Bucket B — serial tests (make serial-tests)
        # ONLY through the Makefile. Never a bucket B file directly: two of the
        # five rewrite oncotriage/ in place and restore from a backup taken at
        # their own start, the order is load-bearing, and run_serial_tests.py
        # holds an flock so two runs cannot interleave their restore windows.
        # A separate step AFTER bucket A, so the two never overlap.
        if: always() && steps.serial.outputs.serial_ready == 'true'
        env:
          ONCOTRIAGE_MAIN_PATH: ${{ github.workspace }}
        run: make serial-tests

      - name: Bucket B — report why the serial suite did not run
        # NOT a silent skip. Four of the five members need licence-gated or
        # generated inputs that cannot exist on a hosted runner, so on
        # GitHub-hosted runners this is the branch taken, and it prints exactly
        # which member needed what. A run that tested nothing must not read like
        # a run that passed — that is the defect pass 20g fixed in Files 18/19.
        if: always() && steps.serial.outputs.serial_ready != 'true'
        run: |
          echo "::warning title=Serial suite not run::4 of 5 collision-matrix members need inputs a hosted runner cannot have. See the step output."
          cat "$RUNNER_TEMP/serial-preconditions.txt"
          {
            echo "### Bucket B (serial) — NOT RUN"
            echo
            echo 'Members run only through `make serial-tests`, which needs every member runnable.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/serial-preconditions.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency vulnerability audit (pip-audit)
        # GATES ON FIXABLE FINDINGS, PRINTS EVERYTHING. The gate and the
        # per-id accepted table live in .github/scripts/audit_gate.py; every
        # accepted entry names the pin that blocks its fix. There is no
        # rule-level or package-level suppression.
        #
        # SEVERITY IS NOT AVAILABLE HERE. pip-audit's JSON carries id,
        # description and fix_versions and no CVSS at all — measured. The
        # severity-aware gate is Trivy, in the `image` job, which scans the same
        # Python packages inside the built image and does report CRITICAL/HIGH.
        #
        # KNOWN ACCEPTED CONSTRAINT, named as the brief requires:
        #     starlette CVE-2025-62727 (PYSEC-2026-1942) is fixed in 0.49.1.
        #     fastapi==0.117.1 declares `starlette<0.49.0`, so pip cannot
        #     resolve the fix. Both are deliberately left alone. Remediation is
        #     moving fastapi past its cap, which is a serving-layer change whose
        #     verification (Files 18 and 19) makes billed model calls.
        #
        # pip and setuptools are upgraded FIRST and deliberately not pinned:
        # they arrive with the runner image, their advisories are about the
        # build tooling rather than this project, and the gate fails if one is
        # still outdated afterwards.
        if: always()
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          python -m pip install --quiet pip-audit
          python .github/scripts/audit_gate.py

  # =========================================================================
  # IMAGE — built through the Makefile, scanned, never pushed
  # =========================================================================
  image:
    name: image (make build + scan)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: '03- Code'

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          path: '03- Code'
          fetch-depth: 0

      - name: Set up Python 3.11
        # Needed only so `python` is on PATH for the Makefile's
        # `$(shell $(PYTHON) docker/app_version.py)`. That script is stdlib-only
        # and imports nothing from the project, so no install is required here.
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Reclaim runner disk before build
        # The built image is 2.91 GB (measured), and the builder stage installs
        # the same ~3.9 GB torch/CUDA download on x86_64. Same reasoning as the
        # tests job; no dependency or pin is changed.
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup || true
          df -h / | tail -1

      - name: Show the derived version
        run: make version

      - name: Build (make build)
        # NOT `docker compose build`. A bare compose build fails by design: the
        # version label arrives as an ARG the Makefile derives, and a
        # `RUN --check` after the source COPY refuses a value that disagrees
        # with oncotriage/__init__.py. Nothing here pushes the image.
        run: make build

      - name: Confirm the image label matches the source
        # The build's own guard already refuses a mismatched ARG. This asserts
        # the label that actually shipped, which is the thing a consumer reads.
        run: |
          built=$(docker inspect clinical-trial-patient-match:latest \
                    --format '{{index .Config.Labels "version"}}')
          derived=$(make --no-print-directory version)
          echo "label=$built derived=$derived"
          test "$built" = "$derived"

      - name: Reclaim disk after the build, before the scan
        # THE BUILD FILLS THE RUNNER, AND TRIVY NEEDS ROOM AFTER IT. Measured on
        # run 3: 34 GB free after the pre-build reclaim, then `make build` left
        # 2 MB and Trivy died with
        #     no space left on device ... /tmp/trivy-*/docker-export-*
        # because scanning through the docker socket EXPORTS the whole 2.91 GB
        # image to a temp file first.
        #
        # The build cache is what to drop: it holds the builder stage's ~2 GB
        # venv and every intermediate layer, and the tagged image does not need
        # any of it. `docker builder prune -af` keeps
        # clinical-trial-patient-match:latest, which the next two steps read —
        # asserted below rather than assumed, because a prune that removed the
        # image would make the scan pass by scanning nothing.
        working-directory: .
        run: |
          df -h / | tail -1
          docker builder prune -af
          docker image prune -f
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/swift \
                      /usr/local/share/powershell || true
          df -h / | tail -1
          docker image inspect clinical-trial-patient-match:latest \
            --format 'image still present: {{.Id}}'

      - name: Container image vulnerability scan (Trivy) — GATE, fixable only
        # `--ignore-unfixed` IS THE GATE'S SHAPE. A finding Debian has not
        # released a fix for cannot be acted on here: the base distribution is
        # fixed by the digest pin and changing it is out of scope. Gating on
        # those would be a permanently-red check no commit can turn green.
        #
        # What IS actionable is anything Debian has already patched, and there
        # is no `apt-get upgrade` in the Dockerfile taking those at build time.
        # There was one; it is reverted, argued at STAGE 2 with the measurement
        # that it cleared nothing and the reason it is not neutral (it reaches
        # the network at build time, so two builds of one commit differ). THE
        # ABSENCE IS THE MECHANISM, not a gap in it: a fixable OS finding has
        # nowhere to go at build time, so this gate turns red the day Debian
        # publishes a fix, and the only two ways out are
        #
        #   1. re-pin the digest on BOTH FROM lines to a base image that
        #      carries the fix — the supported route, and the one this gate
        #      exists to force; or
        #   2. when no published base image carries it yet, accept the ids in
        #      `.trivyignore` TEMPORARILY, with the removal condition written
        #      beside them. That is what the BASE-LAG block there is.
        #
        # Route 2 is a delay, not a decision, and it is the reason for the
        # `.trivyignore` staleness step below: the acceptance dies on its own
        # the moment the finding stops appearing.
        #
        # `--ignorefile` points at the repository's `.trivyignore`, which lists
        # accepted findings ONE CVE AT A TIME with the constraint that blocks
        # each fix. It is mounted read-only rather than relied on by working
        # directory, because Trivy runs inside its own container here and would
        # otherwise never see it — a silently-unread ignore file would make this
        # gate fail on findings the repository has already argued about.
        #
        # `--timeout 20m` is required — the default is 5 minutes and the first
        # real run died on it. See the disk-reclaim step above for the second
        # failure this scan hit (`no space left on device`).
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$PWD/.trivyignore:/tmp/.trivyignore:ro" \
            aquasec/trivy:0.73.0 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile /tmp/.trivyignore \
              --exit-code 1 \
              --timeout 20m \
              --no-progress \
              clinical-trial-patient-match:latest

      - name: Container image vulnerability scan (Trivy) — FULL, non-gating
        # EVERYTHING, including the unfixable findings the gate skips, so
        # nothing disappears from view. `--exit-code 0` and `if: always()`: this
        # step reports, it does not decide, and it runs even when the gate above
        # failed because the complete picture is most wanted exactly then.
        #
        # NO `--ignorefile` HERE, deliberately: this step's whole job is to show
        # the accepted findings too. Shares $RUNNER_TEMP/trivy-cache with the
        # gate, so the vulnerability database is downloaded once.
        #
        # IT WRITES JSON AND THEN RENDERS THE TABLE FROM THAT SAME FILE. There
        # is no second scan: `trivy convert` re-renders a report it is handed,
        # and the step after this one reads the JSON to check `.trivyignore`
        # for stale entries. This scan is the only one that can answer that
        # question, because it is the only one with no `--ignorefile`, every
        # severity, and unfixed findings included — an accepted id is exactly
        # what the gate is told not to show.
        #
        # THE TABLE IS UNCHANGED, AND THAT WAS MEASURED RATHER THAN ASSUMED:
        # rendered through `convert` it is BYTE-IDENTICAL to what this step
        # printed before (sha256 46776b55…, 2,503 lines, arm64 local image).
        # `--severity` is repeated on the convert because without it the Total
        # lines gain a `UNKNOWN: 0` column that the scan-time filter removes —
        # two lines of difference, and the reason the flag is there.
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/trivy-reports"
          # Removed BEFORE the scan, not after: if this scan fails, the step
          # below must say "no report" rather than read a previous one. Hosted
          # runners give each job a fresh RUNNER_TEMP and this is a no-op
          # there; a self-hosted runner is where it earns its keep.
          rm -f "$RUNNER_TEMP/trivy-reports/trivy-full.json"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP/trivy-reports:/reports" \
            aquasec/trivy:0.73.0 image \
              --scanners vuln \
              --severity LOW,MEDIUM,HIGH,CRITICAL \
              --exit-code 0 \
              --timeout 20m \
              --no-progress \
              --format json \
              --output /reports/trivy-full.json \
              clinical-trial-patient-match:latest
          docker run --rm \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP/trivy-reports:/reports" \
            aquasec/trivy:0.73.0 convert \
              --format table \
              --scanners vuln \
              --severity LOW,MEDIUM,HIGH,CRITICAL \
              /reports/trivy-full.json

      - name: .trivyignore staleness — an accepted id must still appear
        # THE SAME CHECK THE pip-audit GATE ALREADY HAS, FOR THE OTHER SCANNER.
        # `.github/scripts/audit_gate.py` exits 2 when an id in its accepted
        # table has stopped appearing, on the argument that a dead exemption is
        # re-read by the next person as a live constraint. `.trivyignore` had
        # no such check, and it now holds entries whose whole point is that they
        # EXPIRE — the BASE-LAG block, four util-linux ids that clear the moment
        # a base image carrying Debian's fix is published. That block's own
        # removal condition says leaving it there afterwards is the failure
        # mode. This is what notices.
        #
        # IT FAILS THE JOB ON EXIT 2, WHICH IS THE POINT. It gates on the
        # hygiene of the accepted table, never on vulnerabilities: it cannot
        # make the Trivy gate greener and it never reads severity to decide
        # anything. Exit 1 means the report was missing or unreadable and the
        # comparison could not be made — including when the FULL step above
        # failed, which is an honest cascade rather than a silent pass.
        #
        # `always()` for the same reason the FULL step has it: a red gate is
        # exactly when a stale acceptance most needs to surface, and without it
        # a gate failure would hide this one until the gate went green.
        #
        # No install: the script is stdlib-only, and the Python on PATH here is
        # the one set up for the Makefile's version derivation.
        if: always()
        run: |
          python .github/scripts/trivyignore_staleness.py \
            --report "$RUNNER_TEMP/trivy-reports/trivy-full.json"

  # =========================================================================
  # SECRET SCAN — the full history, not the working tree
  # =========================================================================
  secret-scan:
    name: secret scan (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out with full history
        uses: actions/checkout@v5
        with:
          # REQUIRED. The working tree is one commit; a credential removed in a
          # later commit is still in the objects and still clonable.
          fetch-depth: 0

      - name: Name the scanner and version
        # So an empty result is attributable to a specific scanner build rather
        # than to "nothing ran".
        run: docker run --rm zricethezav/gitleaks:v8.30.1 version

      - name: gitleaks — every commit on every ref
        # `--log-opts` is what makes this a history scan: --all covers every
        # ref, --full-history stops git simplifying merge history away.
        # --redact keeps any hit out of a public log; the fingerprint is enough
        # to locate it.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1 git \
              --log-opts="--all --full-history" \
              --report-format=sarif \
              --report-path=/repo/gitleaks.sarif \
              --redact \
              --exit-code 1 \
              --verbose

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn
