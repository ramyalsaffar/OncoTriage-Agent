# Packaging for the `oncotriage` package (item 20c, pass 1; dependencies and
# version merged in at pass 20f-2).
#
# WHAT THIS DECLARES AND DOES NOT DECLARE
# ---------------------------------------
# It declares ONE package: `oncotriage`. The numbered scripts beside it are not
# modules and are not listed — their filenames contain spaces and leading
# digits, so they are not importable under any name.
#
# `oncotriage_settings.py` USED TO BE MENTIONED HERE and no longer exists. It
# was a re-export shim over `oncotriage/settings.py`, kept because two files
# loaded it BY FILE LOCATION under exactly that name, which never consults
# sys.path. Both stopped: "28- Select Evaluation Sample.py" at pass 20c-3d, and
# "01- Imports.py" earlier still at pass 20c-2b, when
# `oncotriage/paths.py:_load_path_settings()` became a plain import. Pass 20e
# measured that it had zero consumers of any kind — the only hits for its
# filename in the whole tree were these two comments — and deleted it, along
# with six other numbered shims. See "PIPELINE SEQUENCE.md".
#
#
# THE DEPENDENCY LIST IS HERE NOW, AND IT IS THE ONLY ONE (pass 20f-2)
# ---------------------------------------------------------------------------
# Until this pass there were THREE declarations and they disagreed:
#
#   requirements/requirements.txt   30 pins, measured from the development
#                                   interpreter on 2026-08-06
#   pyproject.toml                  none at all, with a written argument for
#                                   declaring none
#   {project root}/07- Requirements/requirements.txt
#                                   a stale sibling, outside the repository,
#                                   read by nothing
#
# The in-repo file's own header called the duplication "THE TOP-RANKED
# FOLLOW-UP" and named the blocker: this file "declines to do that today and
# says why (needs the versions pinned from a working environment, not
# guessed)". Item 21 supplied exactly that measurement, so the blocker was
# already gone; what remained was that merging changes how the package installs
# for every consumer, which is what this pass decided to do.
#
# WHAT HAPPENED TO `requirements/requirements.txt`: IT IS DELETED. Not kept as
# a lock file, not generated, not checked for agreement — deleted, because a
# second list is a second list however it is produced, and every argument its
# header made for its own existence is now served by this file:
#
#   * "an image that depends on the sibling tree cannot be built from a clean
#     checkout" — pyproject.toml is in the same directory, in the same commit,
#     inside the same Docker build context;
#   * "the versions must come from a working environment, not be guessed" —
#     every pin below is the one it carried, which was read out of `pip list`
#     on the development interpreter (macOS/arm64, Python 3.13.5), with the two
#     exceptions argued at their lines;
#   * "the Dockerfile copies it" — the Dockerfile now reads THIS file, with
#     tomllib, and installs what it finds. See the note there; the layer
#     caching that the separate copy existed for is preserved, because only
#     this file lands in the layer that installs.
#
# `requirements/README.md` replaced it and held no versions, and PASS 20f-3
# DELETED THAT DIRECTORY TOO. Pass 20f-2 left it standing only because
# `oncotriage/paths.py:requirements_path` named it and `_DOCKER_PATHS` mapped it
# to /app/requirements/, and it recorded the follow-up with the whole edit
# written out: drop the variable from both tables, drop the directory, and
# correct the "fourteen" in DOCKER CLEAN BRING-UP.md and CLAUDE.md. That is
# done. The container's bring-up report is thirteen paths, and there is no path
# variable left in this project that no code reads.
#
# Everything the deleted README said is in THIS comment block already — the
# install command, what the Dockerfile does with this file, and the stale
# sibling below — so nothing went with it.
#
# THE STALE SIBLING IS NOT TOUCHED, and it is outside the repository so this
# commit cannot touch it. Nothing resolves to it any more: pass 20f-3 removed
# the only variable that ever pointed at it, and no code ever read that
# variable.
#
# CONSEQUENCE, stated rather than discovered: `pip install .` into an empty
# environment now gives you a WORKING package, which it did not before. The old
# note here recorded the opposite — "an importable package whose imports all
# fail" — as "the honest state of the split". That state is over.
#
#
# HOW THE PINS WERE CHOSEN
# ---------------------------------------------------------------------------
# `==` on everything, carried over verbatim from the file this replaces, and
# that is a deliberate choice rather than an oversight. This project's stated
# property is determinism, its acceptance criterion is twelve byte-compared
# characterization fixtures, and a `>=` range means two machines running the
# same commit can disagree about a ranking with nothing to point at. The cost
# is that `pip install oncotriage` alongside anything else will conflict, and
# that cost is accepted: this is an application, distributed as a container and
# as a checkout, not a library other people depend on.
#
# TWO PACKAGES ARE IMPORT-TIME HARD REQUIREMENTS and are easy to miss because
# neither is imported at the top of any module:
#
#   * fastembed  — `oncotriage/embedding.py` is the ONE construction site for
#                  SparseTextEmbedding(BM25_SPARSE_MODEL_NAME), the sparse
#                  encoder BOTH halves of BM25 retrieval depend on. The import
#                  is inside get_bm25_sparse_model(), so nothing fails until
#                  the first query or the first index build.
#   * icd10-cm   — `_build_icd10_cancer_sets()` does `import icd10` inside the
#                  function, and since item 11a a failed import RAISES rather
#                  than returning three empty sets. Absent, the cancer registry
#                  cannot be built at all.
#
# httpx is NOT listed: `openai` requires it, so it arrives pinned by a package
# that actually declares the constraint. rank-bm25 IS listed even though
# retrieval has been Qdrant-native since the indexer moved to sparse vectors —
# it is the one entry here whose only justification was "01- Imports.py line 51
# imports BM25Okapi into the shared exec namespace", and pass 20e deleted that
# file. RECORDED AS A FOLLOW-UP: `git grep -n "BM25Okapi\|rank_bm25"` returns
# nothing in the package today, so this pin is a candidate for removal, and it
# is left in place here because dropping a dependency is a change to what an
# existing environment resolves to and belongs in a pass that measures it.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncotriage"
# THE VERSION IS NOT TYPED HERE. It is `oncotriage.__version__`, taken through
# [tool.setuptools.dynamic] below, and pass 20f-2's note in
# oncotriage/__init__.py argues why that direction and not the reverse. This
# file used to declare 0.1.0 while the API served 2.0.0 from two separate
# literals, so `pip show oncotriage` and GET /pipeline/info described the same
# build two major versions apart.
dynamic = ["version"]
# WAS "the importable foundation: settings, paths, config, utils", which was
# true at pass 20c-1 and describes about a tenth of what is in the package now.
description = "OncoTriage Agent — oncology patient / clinical-trial matching over a LangGraph pipeline and hybrid BM25 + vector RAG."
requires-python = ">=3.10"
dependencies = [
    # --- Core scientific computing ------------------------------------------
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.15.3",

    # --- HTTP and utilities -------------------------------------------------
    # THE THREE PINS BELOW AND `langgraph` MOVED FOR SECURITY, not for features.
    # Each clears pip-audit findings that HAVE a fix, and each was chosen as the
    # lowest release clearing all of that package's findings:
    #
    #   requests          2.32.3  -> 2.33.0   PYSEC-2026-1872, -2275
    #   python-dotenv     1.1.0   -> 1.2.2    PYSEC-2026-2270
    #   python-multipart  0.0.22  -> 0.0.31   PYSEC-2026-3036..3040 (five)
    #   langgraph         1.0.8   -> 1.0.10   PYSEC-2026-83
    #
    # NONE OF THE FOUR TOUCHES RANKING OR MODEL OUTPUT, which is the line this
    # project draws: requests and python-dotenv are I/O and config plumbing,
    # python-multipart parses multipart form bodies for the one upload endpoint,
    # and langgraph 1.0.8 -> 1.0.10 is a patch on the graph runner rather than on
    # any node. Contrast torch, transformers, streamlit and pillow, which all
    # have fixes available and are all deliberately NOT bumped here -- see the
    # accepted-findings table in .github/scripts/audit_gate.py.
    "requests==2.33.0",
    "python-dotenv==1.2.2",
    "python-dateutil==2.9.0.post0",

    # --- OpenAI -------------------------------------------------------------
    "openai==1.99.9",

    # --- Vector database ----------------------------------------------------
    # 1.18.0, NOT the 1.16.2 the requirements file pinned, and the bump is a fix
    # rather than a refresh (pass 20f-2). Qdrant Cloud is serving 1.18.3, and
    # qdrant-client checks the pair on construction:
    #
    #     UserWarning: Qdrant client version 1.16.2 is incompatible with server
    #     version 1.18.3. Major versions should match and minor version
    #     difference must not exceed 1.
    #
    # Every get_qdrant_client() call emitted that — the indexer, the validator,
    # the agent, the backup, the fixture harness — so the project's own logs
    # carried a compatibility warning on every run and nothing acted on it.
    #
    # 1.18.0 rather than 1.19.0 (the latest) because matching the server's MINOR
    # exactly leaves a full version of margin in BOTH directions: it stays
    # inside the rule if the cloud rolls forward to 1.19 or back to 1.17, and
    # 1.19.0 would not survive a rollback. Nothing else in the environment moved
    # to accommodate it — measured with `pip install --dry-run`, the resolution
    # touches qdrant-client alone.
    "qdrant-client==1.18.0",

    # --- Embeddings and NLP -------------------------------------------------
    "sentence-transformers==5.2.2",
    "transformers==4.57.1",
    "torch==2.9.0",
    # The Qdrant/bm25 sparse encoder. See the note above; it is a hard
    # requirement that no module imports at the top.
    "fastembed==0.7.4",

    # --- Search and ranking -------------------------------------------------
    "rank-bm25==0.2.2",

    # --- Medical coding -----------------------------------------------------
    # `import icd10`. Since item 11a its absence RAISES instead of silently
    # degrading the cancer registry to three empty sets.
    "icd10-cm==0.0.5",

    # --- Agent framework ----------------------------------------------------
    "langgraph==1.0.10",

    # --- Model Context Protocol ---------------------------------------------
    # The official MCP Python SDK, for `oncotriage/mcp/server.py`. 2.0.0 is the
    # current release and the one the server was written against: its API is
    # `from mcp.server import MCPServer` plus `@mcp.tool()`, which is NOT the
    # `mcp.server.fastmcp.FastMCP` of the 1.x line, so this pin and that code
    # move together.
    #
    # `sse-starlette` IS PINNED HERE AND MCP DOES NOT PIN IT, and that is a
    # conflict fix rather than a preference. mcp 2.0.0 requires
    # `sse-starlette>=3.0.0`; the current release of that package, 3.4.8,
    # requires `starlette>=0.49.1`; and `fastapi==0.117.1` above requires
    # `starlette<0.49.0`. Installing mcp without this line therefore drags
    # starlette to 1.4.1 and BREAKS THE FASTAPI SERVER -- measured, not
    # predicted: `import oncotriage.api.server` then dies at `FastAPI(...)` with
    # `TypeError: Router.__init__() got an unexpected keyword argument
    # 'on_startup'`, so item 17, the dashboard's sibling service and the whole
    # compose stack stop working the moment somebody installs the MCP extra.
    #
    # 3.0.2 is the newest release whose starlette requirement is an EXTRA
    # (`starlette>=0.41.3; extra == "examples"`) rather than a hard dependency,
    # so it constrains nothing and satisfies mcp's `>=3.0.0`. Every 3.1.0 and
    # later carries the hard `>=0.49.1`. Nothing in this project uses
    # sse-starlette at all -- the MCP server speaks stdio and never the SSE or
    # streamable-HTTP transports -- so pinning it low costs nothing that is
    # used; it is here purely to keep pip's resolver off starlette.
    #
    # THE REAL FIX IS TO MOVE FASTAPI FORWARD, and it is deliberately not done
    # here: raising fastapi past its starlette cap is a change to the serving
    # layer that item 21's container bring-up and Files 18/19 measure, and it
    # does not belong in the pass that added a second protocol. Recorded as a
    # follow-up.
    "mcp==2.0.0",
    "sse-starlette==3.0.2",

    # --- API server ---------------------------------------------------------
    "fastapi==0.117.1",
    "uvicorn[standard]==0.40.0",
    "python-multipart==0.0.31",
    "pydantic==2.12.5",
    "slowapi==0.1.9",

    # --- Dashboard and plotting ---------------------------------------------
    # 1.46.0, NOT the 1.45.1 installed on the development machine, and this is
    # the one pin here that is not simply what `pip list` reported. THE MEASURED
    # ENVIRONMENT IS NOT INSTALLABLE:
    #
    #     streamlit           1.45.1  requires packaging >=20,<25
    #     apache-airflow-core 3.1.7   requires packaging >=25.0
    #
    # No version of `packaging` satisfies both, so pip refuses the combination
    # outright ("ResolutionImpossible") — measured by building the image with
    # 1.45.1 pinned. The development machine has both installed anyway, with
    # packaging 26.0, and `pip check` says so in as many words:
    #
    #     streamlit 1.45.1 has requirement packaging<25,>=20, but you have
    #     packaging 26.0
    #
    # STILL TRUE AT PASS 20f-2, re-measured: `pip check` reports that same line
    # today. The dashboard on that machine runs against a `packaging` its own
    # metadata declares incompatible. That is a finding about the development
    # environment, not about this pin, and the fix is `pip install
    # streamlit==1.46.0` on that machine — bringing it up to what this file
    # already says — not editing the pin down to match a stale install.
    #
    # 1.46.0 is the SMALLEST step that resolves: it relaxes the cap to
    # `packaging<26`, so packaging 25.x satisfies Airflow's `>=25` and
    # streamlit's `<26` at once. Later releases (1.61.1 drops the bound
    # entirely) would also resolve and were not chosen: the dashboard code was
    # written against 1.45.x, and tests/test_package_invariants.py check 6b
    # asserts against a PRIVATE streamlit internal
    # (cache_utils._make_function_key), which is exactly what a sixteen-minor
    # jump breaks.
    "streamlit==1.46.0",
    "plotly==5.24.1",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",

    # --- Orchestration ------------------------------------------------------
    # MOVED OUT OF THE DEFAULT INSTALL to [project.optional-dependencies] as
    # the `orchestration` extra. See the argument there, including the two
    # CRITICALs this does NOT fix.

    # --- Async support ------------------------------------------------------
    "nest-asyncio==1.6.0",

    # --- macOS sleep suppression --------------------------------------------
    # macOS-only in EFFECT (CaffeinateSession is a no-op elsewhere) but NOT in
    # IMPORT: `oncotriage/utils.py` does an unguarded `import caffeine as
    # _caffeine_mod` at module scope, so it has to be installed on Linux too or
    # importing utils fails.
    "caffeine==0.5",

    # --- Retry / progress ---------------------------------------------------
    "tenacity==9.0.0",
    "tqdm==4.67.1",
]

# NOTES CARRIED OVER FROM THE FILE THIS REPLACES
# ---------------------------------------------------------------------------
# - sqlite3 is built into Python; no pin exists or is needed.
# - On Apple Silicon, torch auto-detects and uses MPS.
# - The container is linux/<host arch> on Python 3.11; the measured environment
#   above is macOS/arm64 on Python 3.13. Same package versions, different
#   interpreter minor. That combination is exercised by item 21's in-container
#   import sweep and by a real POST /match, not assumed.

[project.optional-dependencies]
# ORCHESTRATION — Airflow, and the only other package that exists for it.
#
# THIS IS A SCOPE REDUCTION, NOT REMEDIATION. Moving Airflow out of the default
# install does not fix anything in it. It removes it from what a default
# `pip install` resolves, and therefore from what CI installs and what
# pip-audit and Trivy see. These two CRITICALs are still present, still
# unfixed, and still shipped to anyone who installs the extra or runs the
# Docker stack:
#
#     CVE-2025-57735  apache-airflow 3.1.7  JWT token still valid after logout
#                                           (fixed in 3.2.0)
#     CVE-2026-42252  apache-airflow 3.1.7  template-engine injection
#                                           (fixed in 3.2.2)
#
# plus nine HIGHs across apache-airflow and apache-airflow-core at the same
# version. Do not describe this move as a fix anywhere. The remediation is an
# upgrade to >= 3.2.2, which is a separate decision because Airflow majors
# change the scheduler, the metadata database schema and the REST API this
# project's `oncotriage/orchestration/airflow_manager.py` talks to.
#
# WHY THESE TWO PACKAGES AND NOTHING ELSE, derived rather than assumed. The
# full dependency closure was resolved twice with pip's own resolver, once with
# apache-airflow and pendulum and once without:
#
#     with    207 packages
#     without 131 packages
#     -> 76 packages exist ONLY because of Airflow
#
# Of those 76, exactly TWO are declared here; the other 74 are transitive and
# follow automatically (alembic, sqlalchemy, the four opentelemetry exporters,
# the six apache-airflow-providers-*, rich, typer, croniter, ...). `pendulum`
# is in that set and nothing else in the closure requires it: it appears in the
# with-Airflow resolution and not in the without-Airflow one, and the project's
# only use of it is the `import pendulum` line INSIDE the generated DAG string
# in oncotriage/orchestration/dag_generator.py, which is executed by Airflow's
# parser in a separate process.
#
# NOTHING IN oncotriage/orchestration/ IMPORTS AIRFLOW, verified by AST rather
# than by grep: dag_generator.py's only imports are pathlib, oncotriage.paths,
# oncotriage.settings, orchestration.home and observability. The `import
# pendulum` and `from airflow.sdk import dag, task` that a grep finds at lines
# 112-113 sit inside a string literal spanning lines 91-121 — the DAG text,
# not this module's imports. airflow_manager.py shells out through subprocess
# and talks to the scheduler over REST; airflow_setup.py shells out to
# `airflow db migrate`. So the package imports, and bucket A passes, with
# Airflow absent.
#
#     pip install -e .                    # pipeline only, no Airflow
#     pip install -e ".[orchestration]"   # adds Airflow, for Files 22/23/24
#
# The Docker image installs this extra explicitly — docker-compose.yml runs
# airflow-scheduler and airflow-apiserver from the same image, and a
# default-only install would leave both without Airflow. See the Dockerfile.
orchestration = [
    "apache-airflow==3.1.7",
    "pendulum==3.2.0",
]

[tool.setuptools.dynamic]
# setuptools reads this attribute from the AST of oncotriage/__init__.py at
# BUILD time — it does not import the package, so nothing here depends on the
# sibling data tree being present. The one requirement it imposes is that
# `__version__` stays a plain string literal assigned at module level in that
# file.
version = {attr = "oncotriage.__version__"}

[tool.setuptools]
# Explicit, not auto-discovered. Auto-discovery over this directory would trip
# over the space-containing scripts beside the package.
#
# EVERY SUBPACKAGE IS LISTED. setuptools does not recurse into a listed package
# for you, so a subpackage added to the tree and not added here is present in an
# editable install (which maps the source tree) and ABSENT from a built wheel.
# That difference would not show up until someone built one.
packages = [
    "oncotriage",
    "oncotriage.registries",
    "oncotriage.extraction",
    "oncotriage.fhir",
    "oncotriage.retrieval",
    "oncotriage.storage",
    "oncotriage.agent",
    # Pass 20c-3b: the serving layer.
    "oncotriage.api",
    "oncotriage.monitoring",
    "oncotriage.batch",
    # Pass 20c-3c-1: the Streamlit dashboard. BOTH levels have to be listed --
    # setuptools does not recurse into a listed package, so declaring only
    # "oncotriage.dashboard" would ship a wheel whose dashboard has no tabs.
    "oncotriage.dashboard",
    "oncotriage.dashboard.tabs",
    # Pass 20c-3c-2: the Airflow orchestration layer (Files 22, 23, 24).
    # File 29 became oncotriage/retrieval/qdrant_backup.py, inside a subpackage
    # already listed above, so it needs no entry here.
    "oncotriage.orchestration",
    # Pass 20c-3d, the last conversion pass: the ablation study and its
    # analysis (Files 26 and 27), the two offline measurements (Files 28 and
    # 34), and the characterization fixture harness (Files 45 and 46).
    "oncotriage.ablation",
    "oncotriage.evaluation",
    "oncotriage.fixtures",
    # The MCP pass: the stdio Model Context Protocol server. Named
    # `oncotriage.mcp` beside the third-party `mcp` it imports, which is safe
    # because Python 3 resolves imports absolutely; the argument and the check
    # that proves it are in `oncotriage/mcp/__init__.py` and
    # `tests/test_mcp_server_stdio_contract.py`.
    "oncotriage.mcp",
]
