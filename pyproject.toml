# Packaging for the `oncotriage` package (item 20c, pass 1; dependencies and
# version merged in at pass 20f-2).
#
# WHAT THIS DECLARES AND DOES NOT DECLARE
# ---------------------------------------
# It declares ONE package: `oncotriage`. The numbered scripts beside it are not
# modules and are not listed — their filenames contain spaces and leading
# digits, so they are not importable under any name.
#
# `oncotriage_settings.py` USED TO BE MENTIONED HERE and no longer exists. It
# was a re-export shim over `oncotriage/settings.py`, kept because two files
# loaded it BY FILE LOCATION under exactly that name, which never consults
# sys.path. Both stopped: "28- Select Evaluation Sample.py" at pass 20c-3d, and
# "01- Imports.py" earlier still at pass 20c-2b, when
# `oncotriage/paths.py:_load_path_settings()` became a plain import. Pass 20e
# measured that it had zero consumers of any kind — the only hits for its
# filename in the whole tree were these two comments — and deleted it, along
# with six other numbered shims. See "PIPELINE SEQUENCE.md".
#
#
# THE DEPENDENCY LIST IS HERE NOW, AND IT IS THE ONLY ONE (pass 20f-2)
# ---------------------------------------------------------------------------
# Until this pass there were THREE declarations and they disagreed:
#
#   requirements/requirements.txt   30 pins, measured from the development
#                                   interpreter on 2026-08-06
#   pyproject.toml                  none at all, with a written argument for
#                                   declaring none
#   {project root}/07- Requirements/requirements.txt
#                                   a stale sibling, outside the repository,
#                                   read by nothing
#
# The in-repo file's own header called the duplication "THE TOP-RANKED
# FOLLOW-UP" and named the blocker: this file "declines to do that today and
# says why (needs the versions pinned from a working environment, not
# guessed)". Item 21 supplied exactly that measurement, so the blocker was
# already gone; what remained was that merging changes how the package installs
# for every consumer, which is what this pass decided to do.
#
# WHAT HAPPENED TO `requirements/requirements.txt`: IT IS DELETED. Not kept as
# a lock file, not generated, not checked for agreement — deleted, because a
# second list is a second list however it is produced, and every argument its
# header made for its own existence is now served by this file:
#
#   * "an image that depends on the sibling tree cannot be built from a clean
#     checkout" — pyproject.toml is in the same directory, in the same commit,
#     inside the same Docker build context;
#   * "the versions must come from a working environment, not be guessed" —
#     every pin below is the one it carried, which was read out of `pip list`
#     on the development interpreter (macOS/arm64, Python 3.13.5), with the two
#     exceptions argued at their lines;
#   * "the Dockerfile copies it" — the Dockerfile now reads THIS file, with
#     tomllib, and installs what it finds. See the note there; the layer
#     caching that the separate copy existed for is preserved, because only
#     this file lands in the layer that installs.
#
# `requirements/README.md` replaced it and held no versions, and PASS 20f-3
# DELETED THAT DIRECTORY TOO. Pass 20f-2 left it standing only because
# `oncotriage/paths.py:requirements_path` named it and `_DOCKER_PATHS` mapped it
# to /app/requirements/, and it recorded the follow-up with the whole edit
# written out: drop the variable from both tables, drop the directory, and
# correct the "fourteen" in DOCKER CLEAN BRING-UP.md and CLAUDE.md. That is
# done. The container's bring-up report is thirteen paths, and there is no path
# variable left in this project that no code reads.
#
# Everything the deleted README said is in THIS comment block already — the
# install command, what the Dockerfile does with this file, and the stale
# sibling below — so nothing went with it.
#
# THE STALE SIBLING IS NOT TOUCHED, and it is outside the repository so this
# commit cannot touch it. Nothing resolves to it any more: pass 20f-3 removed
# the only variable that ever pointed at it, and no code ever read that
# variable.
#
# CONSEQUENCE, stated rather than discovered: `pip install .` into an empty
# environment now gives you a WORKING package, which it did not before. The old
# note here recorded the opposite — "an importable package whose imports all
# fail" — as "the honest state of the split". That state is over.
#
#
# HOW THE PINS WERE CHOSEN
# ---------------------------------------------------------------------------
# `==` on everything, carried over verbatim from the file this replaces, and
# that is a deliberate choice rather than an oversight. This project's stated
# property is determinism, its acceptance criterion is twelve byte-compared
# characterization fixtures, and a `>=` range means two machines running the
# same commit can disagree about a ranking with nothing to point at. The cost
# is that `pip install oncotriage` alongside anything else will conflict, and
# that cost is accepted: this is an application, distributed as a container and
# as a checkout, not a library other people depend on.
#
# TWO PACKAGES ARE IMPORT-TIME HARD REQUIREMENTS and are easy to miss because
# neither is imported at the top of any module:
#
#   * fastembed  — `oncotriage/embedding.py` is the ONE construction site for
#                  SparseTextEmbedding(BM25_SPARSE_MODEL_NAME), the sparse
#                  encoder BOTH halves of BM25 retrieval depend on. The import
#                  is inside get_bm25_sparse_model(), so nothing fails until
#                  the first query or the first index build.
#   * icd10-cm   — `_build_icd10_cancer_sets()` does `import icd10` inside the
#                  function, and since item 11a a failed import RAISES rather
#                  than returning three empty sets. Absent, the cancer registry
#                  cannot be built at all.
#
# httpx is NOT listed: `openai` requires it, so it arrives pinned by a package
# that actually declares the constraint. rank-bm25 IS listed even though
# retrieval has been Qdrant-native since the indexer moved to sparse vectors —
# it is the one entry here whose only justification was "01- Imports.py line 51
# imports BM25Okapi into the shared exec namespace", and pass 20e deleted that
# file. RECORDED AS A FOLLOW-UP: `git grep -n "BM25Okapi\|rank_bm25"` returns
# nothing in the package today, so this pin is a candidate for removal, and it
# is left in place here because dropping a dependency is a change to what an
# existing environment resolves to and belongs in a pass that measures it.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncotriage"
# THE VERSION IS NOT TYPED HERE. It is `oncotriage.__version__`, taken through
# [tool.setuptools.dynamic] below, and pass 20f-2's note in
# oncotriage/__init__.py argues why that direction and not the reverse. This
# file used to declare 0.1.0 while the API served 2.0.0 from two separate
# literals, so `pip show oncotriage` and GET /pipeline/info described the same
# build two major versions apart.
dynamic = ["version"]
# WAS "the importable foundation: settings, paths, config, utils", which was
# true at pass 20c-1 and describes about a tenth of what is in the package now.
description = "OncoTriage Agent — oncology patient / clinical-trial matching over a LangGraph pipeline and hybrid BM25 + vector RAG."
requires-python = ">=3.10"
authors = [{ name = "Ramy Alsaffar", email = "ramyalsaffar@gmail.com" }]
# THE LICENCE KEY IS THE PEP 621 TABLE FORM, NOT PEP 639's STRING, AND THAT WAS
# MEASURED RATHER THAN CHOSEN. PEP 639 (`license = "PolyForm-Noncommercial-1.0.0"`
# plus `license-files`) needs setuptools >= 77; the development interpreter here
# carries setuptools 72.1.0 (measured 2026-09-02), where that form does not warn
# — it RAISES `ValueError: project.license must be valid exactly by one
# definition`, so a `--no-build-isolation` install fails outright. The image is
# on the other side of that line (the builder pins `setuptools>=78.1.1` and
# installs with --no-build-isolation), so both forms build THERE; only the table
# form builds in BOTH places, which is why it is the one written down.
#
# `{ text = ... }` AND NOT `{ file = "LICENSE" }`: the file form inlines the
# whole licence into the `License:` core-metadata field — measured, METADATA
# goes 181 -> 5436 bytes and `pip show oncotriage` prints the entire PolyForm
# text — while the text form gives the one-line SPDX identifier a reader wants.
# Nothing is lost by not naming the file: `License-File: LICENSE` is emitted in
# EVERY form, from [tool.setuptools]'s default LICEN[CS]E* glob, so the licence
# ships in the sdist and the wheel either way. There is no `license-files` key
# here for the same reason the string form is absent — it is PEP 639 and fails
# identically on 72.1.0.
#
# THE COST, STATED: setuptools >= 77 emits `SetuptoolsDeprecationWarning:
# project.license as a TOML table is deprecated` (measured against 84.0.0). The
# migration is two lines — this key becomes the bare string plus
# `license-files = ["LICENSE"]`, and [build-system] requires becomes
# "setuptools>=77" — and it is correct the day this machine's setuptools clears
# 77. Deliberately NOT done today, because raising that floor breaks the
# --no-build-isolation path on the interpreter this project is developed on.
#
# NO License CLASSIFIER: PEP 639 deprecates them, there is no
# `License :: OSI Approved ::` entry for PolyForm (it is not an OSI-approved
# licence), and a `License :: Other/Proprietary License` classifier would say
# strictly less than the identifier already on the line above.
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    # --- Core scientific computing ------------------------------------------
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.15.3",

    # --- HTTP and utilities -------------------------------------------------
    # THE THREE PINS BELOW AND `langgraph` MOVED FOR SECURITY, not for features.
    # Each clears pip-audit findings that HAVE a fix, and each was chosen as the
    # lowest release clearing all of that package's findings:
    #
    #   requests          2.32.3  -> 2.33.0   PYSEC-2026-1872, -2275
    #   python-dotenv     1.1.0   -> 1.2.2    PYSEC-2026-2270
    #   python-multipart  0.0.22  -> 0.0.31   PYSEC-2026-3036..3040 (five)
    #   langgraph         1.0.8   -> 1.0.10   PYSEC-2026-83
    #
    # NONE OF THE FOUR TOUCHES RANKING OR MODEL OUTPUT, which is the line this
    # project draws: requests and python-dotenv are I/O and config plumbing,
    # python-multipart parses multipart form bodies for the one upload endpoint,
    # and langgraph 1.0.8 -> 1.0.10 is a patch on the graph runner rather than on
    # any node. Contrast torch, transformers, streamlit and pillow, which all
    # have fixes available and are all deliberately NOT bumped here -- see the
    # accepted-findings table in .github/scripts/audit_gate.py.
    "requests==2.33.0",
    "python-dotenv==1.2.2",
    "python-dateutil==2.9.0.post0",

    # --- OpenAI -------------------------------------------------------------
    "openai==1.99.9",

    # --- Vector database ----------------------------------------------------
    # 1.18.0, NOT the 1.16.2 the requirements file pinned, and the bump is a fix
    # rather than a refresh (pass 20f-2). Qdrant Cloud is serving 1.18.3, and
    # qdrant-client checks the pair on construction:
    #
    #     UserWarning: Qdrant client version 1.16.2 is incompatible with server
    #     version 1.18.3. Major versions should match and minor version
    #     difference must not exceed 1.
    #
    # Every get_qdrant_client() call emitted that — the indexer, the validator,
    # the agent, the backup, the fixture harness — so the project's own logs
    # carried a compatibility warning on every run and nothing acted on it.
    #
    # 1.18.0 rather than 1.19.0 (the latest) because matching the server's MINOR
    # exactly leaves a full version of margin in BOTH directions: it stays
    # inside the rule if the cloud rolls forward to 1.19 or back to 1.17, and
    # 1.19.0 would not survive a rollback. Nothing else in the environment moved
    # to accommodate it — measured with `pip install --dry-run`, the resolution
    # touches qdrant-client alone.
    "qdrant-client==1.18.0",

    # --- Embeddings and NLP -------------------------------------------------
    # `sentence-transformers` STOOD HERE AND IS DELETED (the portability pass).
    # NO MODULE IN THIS PROJECT HAS EVER IMPORTED IT -- measured across the
    # whole tree, both spellings, and the only three hits are prose: a comment
    # in oncotriage/agent/deps.py:_build_medcpt_model recording why the
    # CrossEncoder WRAPPER is deliberately NOT used (it applies a default
    # sigmoid that squashes MedCPT's raw -25..25 range, and MedCPT's official
    # usage is AutoModelForSequenceClassification), and two guard lists in
    # tests/ that assert `sentence_transformers` is NOT in sys.modules after a
    # package import. Those guards are unaffected: they name a module, not a
    # distribution, and they pass whether or not it is installed.
    #
    # Nothing else in the resolved environment requires it either -- checked
    # with importlib.metadata over every installed distribution, and the only
    # requirer was `oncotriage` itself. It contributed no accepted finding to
    # .trivyignore or .github/scripts/audit_gate.py, so removing it leaves no
    # stale id behind (audit_gate.py fails on one).
    #
    # It is ~2 GB of transitive install that no code path can reach, in an
    # image this project has twice had to shrink, and a declared dependency
    # nothing imports is the packaging form of the dead declaration check 2h
    # exists to report.
    # --- transformers 5.10.4, NOT 4.57.1, AND THE RANKING WAS MEASURED -------
    # This is the loader for the Stage 3 cross-encoder, so it is the one pin in
    # this file that can change what the pipeline RANKS without changing what it
    # does. It was held at 4.57.1 through five accepted advisories under a MODEL
    # argument reading "the fixtures cannot prove a bump safe"; that argument was
    # about a MISSING MEASUREMENT rather than about a constraint, and this pass
    # took the measurement instead. See the MODEL block in
    # .github/scripts/audit_gate.py for what replaced it.
    #
    # WHAT THE MEASUREMENT WAS, 2026-09-02, on macOS/arm64, free:
    #   * every fixture's REAL recorded (query, trial_texts) pair re-scored
    #     through oncotriage.agent.models.score_pairs -- the shipped seam --
    #     11 patients, 43 rerank passes, 4,300 pairs, with Stage 3's own RRF
    #     fusion reproduced from node_cross_encoder_rerank;
    #   * a REPRODUCIBILITY CONTROL first: two baseline runs at 4.57.1 are
    #     bit-identical, 43/43 vectors, so a delta is attributable;
    #   * a POSITIVE CONTROL: the same probe with CROSS_ENCODER_MAX_LENGTH
    #     forced to 256 moves 3,038/4,300 pairs, 43/43 orders and 11/11 patients'
    #     top-15, largest movement 67 places -- so the harness discriminates and
    #     the zero below is a measured zero rather than a comparison of nothing;
    #   * RESULT: 4.57.1 -> 5.10.4 is BIT-IDENTICAL. 43/43 score vectors, 0 of
    #     4,300 pairs moved, 0 rank changes, 0 top-15 changes.
    #
    # WHY IT IS BIT-IDENTICAL RATHER THAN MERELY CLOSE, and this is the fact
    # that decided CROSS_ENCODER_DTYPE. 5.0.0 changed from_pretrained's default
    # dtype from a forced float32 to "auto" -- the checkpoint's own declaration
    # -- and ncbi/MedCPT-Cross-Encoder's config.json declares
    # `"torch_dtype": "float32"`, so "auto" resolves to exactly what 4.x forced.
    # That is a property of a third-party JSON file and not of this project, so
    # oncotriage/agent/deps.py now PASSES the dtype and verifies what came back.
    # The tokenizer rewrite (5.x drops the slow/fast split and always uses the
    # Rust backend) is a no-op here: this checkpoint ships tokenizer.json, so
    # 4.57.1 was already using that backend.
    #
    # 5.10.4 IS THE LAST PATCH OF THE LOWEST MINOR THAT CLEARS EVERY ACCEPTED
    # ADVISORY. The three accepted ids need 5.3.0, 5.5.0 and 5.10.0, so 5.10 is
    # the floor; OSV reports ZERO advisories against 5.10.4 (and against 5.16.1),
    # so nothing is bought by going further. What going further COSTS is
    # measured: 5.16.1 declares `tokenizers>=0.23.1` and `safetensors>=0.8.0`,
    # which would move the Rust tokenizer -- the one component under this ranker
    # that 5.10.4 leaves exactly where it is -- to clear nothing. 5.10.0 and
    # 5.10.4 declare byte-identical core dependencies (checked against PyPI
    # metadata), so the patch is free.
    #
    # IT MOVES huggingface-hub 0.36.0 -> 1.x, WHICH IS A MAJOR, and that is the
    # one transitive consequence worth naming. Every 5.x declares
    # `huggingface-hub<2.0,>=1.5.0`. fastembed 0.7.4 declares
    # `huggingface-hub<2.0,>=0.20` and tokenizers `<2.0,>=0.16.4`, so both admit
    # it by metadata -- and metadata is a claim, so it was run: fastembed and
    # qdrant-client import and the BM25 path is exercised by the suite.
    "transformers==5.10.4",

    # --- torch 2.10.0, NOT 2.9.0 AND NOT 2.13.0, AND THE STOP IS MEASURED ----
    # transformers 5.10.4 declares `torch>=2.4`, so 2.9.0 already satisfied it
    # and this move is NOT forced. It is taken under the same ruling that took
    # the transformers move -- the four accepted torch advisories were accepted
    # under the same MODEL argument, and the measurement above covers the whole
    # numerical stack rather than one library of it.
    #
    # 2.10.0 CLEARS THREE OF THE FOUR: CVE-2025-2999 (fix 2.9.1),
    # CVE-2025-3001 (fix 2.10.0) and CVE-2026-24747 / PYSEC-2026-2286 (fix
    # 2.10.0). The fourth, CVE-2025-3000 / PYSEC-2025-194, needs 2.13.0 and is
    # NOT taken; the accepted table carries it with a measured blocker and an
    # unreachability argument.
    #
    # WHY THE STOP IS AT 2.10.0 AND NOT AT 2.13.0 -- MEASURED, by resolving each
    # release inside `python:3.11-slim` on BOTH architectures rather than read
    # off the metadata. torch's Linux CUDA dependency markers LOST their
    # `platform_machine == "x86_64"` guard at 2.11.0, so from that release on an
    # aarch64 install pulls fifteen nvidia wheels:
    #
    #     linux/arm64   2.9.0  109 MB / 0 nvidia     <- what ships today
    #                   2.10.0 149 MB / 0 nvidia     <- what ships now
    #                   2.11.0 2.7 GB / 15 nvidia
    #                   2.12.1 2.7 GB / 15 nvidia
    #                   2.13.0 2.7 GB / 15 nvidia
    #     linux/amd64   2.9.0  3.8 GB               2.13.0 2.6 GB
    #
    # `make up` builds linux/arm64 on the development machine, so 2.13.0 would
    # add ~2.6 GB of CUDA to an image with no GPU to clear one local-only
    # `torch.jit.script` advisory. On amd64 the same move would SHRINK the image
    # by 1.2 GB, which is why the number below is a property of the build
    # architecture and not of the release.
    #
    # THE PROPER FIX IS THE CPU WHEEL INDEX AND IT IS NOT DONE HERE.
    # `--index-url https://download.pytorch.org/whl/cpu` gives torch 2.13.0+cpu
    # at 158 MB on arm64 -- measured -- and would make the fourth advisory free.
    # It cannot be expressed in this file: a PEP 508 requirement carries no
    # index, so the Dockerfile would have to install torch OUTSIDE the tomllib
    # extraction that makes this the ONE dependency list, and `+cpu` is a local
    # version that a bare `pip install .` cannot resolve. That is a build-system
    # decision with its own verification, and it is the recorded follow-up.
    #
    # WHAT 2.10.0 DOES TO THE RANKING, measured on the same 4,300 pairs: at
    # 2.13.0 the scores move by at most 1.1e-04 (mean 3.5e-06) -- float32
    # kernel-order noise -- and ZERO ranks, ZERO top-15 memberships and ZERO
    # top-40 memberships change. 2.10.0's own figures are in the pass record.
    # transformers alone is bit-identical; torch is what moves the last bits.
    "torch==2.10.0",
    # The Qdrant/bm25 sparse encoder. See the note above; it is a hard
    # requirement that no module imports at the top.
    "fastembed==0.7.4",

    # --- Search and ranking -------------------------------------------------
    "rank-bm25==0.2.2",

    # --- Medical coding -----------------------------------------------------
    # `import icd10`. Since item 11a its absence RAISES instead of silently
    # degrading the cancer registry to three empty sets.
    "icd10-cm==0.0.5",

    # --- Agent framework ----------------------------------------------------
    "langgraph==1.0.10",

    # --- Model Context Protocol ---------------------------------------------
    # The official MCP Python SDK, for `oncotriage/mcp/server.py`. 2.0.0 is the
    # current release and the one the server was written against: its API is
    # `from mcp.server import MCPServer` plus `@mcp.tool()`, which is NOT the
    # `mcp.server.fastmcp.FastMCP` of the 1.x line, so this pin and that code
    # move together.
    #
    # `sse-starlette` WAS PINNED HERE AT 3.0.2 AND THE PIN IS GONE. It was
    # never wanted for itself — nothing in this project imports it, the MCP
    # server speaks stdio and never the SSE or streamable-HTTP transports — it
    # was there purely to keep pip's resolver away from starlette, because
    # every sse-starlette from 3.1.0 on declares `starlette>=0.49.1` and
    # `fastapi==0.117.1` declared `starlette<0.49.0`. 3.0.2 was the newest
    # release whose starlette requirement was an EXTRA and therefore
    # constrained nothing.
    #
    # THE CAP IT WAS WORKING AROUND IS GONE (see the fastapi pin below), so the
    # line is deleted rather than moved forward. Keeping a pin whose reason has
    # expired is how a dependency gets held at an old release by an argument
    # nobody re-reads; sse-starlette is a transitive dependency of mcp now, the
    # same way httpx is a transitive dependency of openai, and it is left to
    # mcp's own `>=3.0.0` to choose.
    "mcp==2.0.0",

    # --- API server ---------------------------------------------------------
    # 0.136.3, NOT 0.117.1, AND THE AIRFLOW UPGRADE IS WHAT FORCED IT.
    # `apache-airflow-core` 3.1.7 declared
    # `fastapi[standard-no-fastapi-cloud-cli]<0.118.0,>=0.116.0`; 3.2.2 and
    # 3.3.0 declare `>=0.129.0`, and 3.3.0 additionally `<0.137.0`. No Airflow
    # release clears CVE-2025-57735 and CVE-2026-42252 while coexisting with
    # the old pin — pip refuses the combination outright — so the two moves are
    # one move. 0.136.3 is the highest release inside 3.3.0's window.
    #
    # WHAT IT CLEARS, and it is the second half of the reason: fastapi's
    # `starlette<0.49.0` was the PIN-CAP that made SIX starlette advisories
    # unfixable, each of them an accepted entry in
    # .github/scripts/audit_gate.py and three of them also in `.trivyignore`.
    # fastapi 0.136.3 declares `starlette>=0.46.0` with no upper bound, Airflow
    # 3.3.0 declares `starlette>=1.0.1`, and starlette resolves to 1.x — past
    # every one of those six fix versions. All six entries are deleted from
    # both files in the same commit, and audit_gate.py FAILS on a stale
    # accepted id, so leaving them behind would have turned the gate red rather
    # than passing quietly.
    #
    # WHAT IT COSTS, stated rather than discovered later: this is a starlette
    # MAJOR (0.48 -> 1.x) under the serving layer, and `slowapi==0.1.9` sits on
    # top of it. The pass that deferred this move deferred it because "Files 18
    # and 19 measure it and they make billed model calls". That is still true
    # and they are still not run here. What IS run: the whole compose stack is
    # brought up and every service's healthcheck is required green, which
    # exercises `GET /health` through this fastapi and this starlette, and
    # bucket A imports `oncotriage.api.server` in a subprocess with traps armed.
    "fastapi==0.136.3",
    "uvicorn[standard]==0.40.0",
    "python-multipart==0.0.31",
    "pydantic==2.12.5",
    "slowapi==0.1.9",

    # --- Experiment tracking -------------------------------------------------
    # THE RUN-TO-CONFIGURATION INDEX (the tracking pass). `mlflow-skinny` is the
    # CLIENT-ONLY distribution: no flask, no alembic, no sqlalchemy, no server
    # and no UI, so none of that reaches the pip-audit surface or the image.
    #
    # A DEFAULT DEPENDENCY AND NOT AN EXTRA, deliberately. The batch runner and
    # the ablation study are package code and both are indexed by it, so an
    # extra would make the campaign's index optional -- and an index that is
    # optional is an index that is missing exactly when somebody asks which
    # configuration produced a number. Contrast `apache-airflow` in the
    # `orchestration` extra below: nothing in oncotriage/ imports airflow, and
    # the package imports fine without it.
    #
    # MEASURED, not assumed (2026-08-10): installing it into the development
    # environment adds exactly TWO distributions -- this one and databricks-sdk
    # -- and moves NO existing pin. Its own requirement floors are all
    # open-ended upper bounds (`fastapi<1`, `pydantic<3`, `starlette<2`,
    # `uvicorn<1`), which the pins above already satisfy, so it does not drag
    # the serving layer forward the way `mcp` once dragged starlette. pip-audit
    # over the resulting tree reports ZERO findings, so nothing is added to
    # .github/scripts/audit_gate.py's accepted table.
    #
    # 3.15.1 IS WHERE THE FILE STORE ENTERED MAINTENANCE MODE, and that is
    # recorded here because it is the version that made an environment variable
    # necessary: from this release the filesystem backend raises unless
    # MLFLOW_ALLOW_FILE_STORE is set. oncotriage/tracking.py sets it, and its
    # docstring argues why the recommended `sqlite:///` route is not available
    # under skinny (no sqlalchemy, and the model-registry store has no sqlite
    # implementation in this distribution).
    "mlflow-skinny==3.15.1",

    # --- Dashboard and plotting ---------------------------------------------
    # 1.46.0, NOT the 1.45.1 installed on the development machine, and this is
    # the one pin here that is not simply what `pip list` reported. THE MEASURED
    # ENVIRONMENT IS NOT INSTALLABLE:
    #
    #     streamlit           1.45.1  requires packaging >=20,<25
    #     apache-airflow-core 3.1.7   requires packaging >=25.0
    #
    # No version of `packaging` satisfies both, so pip refuses the combination
    # outright ("ResolutionImpossible") — measured by building the image with
    # 1.45.1 pinned. The development machine has both installed anyway, with
    # packaging 26.0, and `pip check` says so in as many words:
    #
    #     streamlit 1.45.1 has requirement packaging<25,>=20, but you have
    #     packaging 26.0
    #
    # STILL TRUE AT PASS 20f-2, re-measured: `pip check` reports that same line
    # today. The dashboard on that machine runs against a `packaging` its own
    # metadata declares incompatible. That is a finding about the development
    # environment, not about this pin, and the fix is `pip install
    # streamlit==1.46.0` on that machine — bringing it up to what this file
    # already says — not editing the pin down to match a stale install.
    #
    # 1.46.0 is the SMALLEST step that resolves: it relaxes the cap to
    # `packaging<26`, so packaging 25.x satisfies Airflow's `>=25` and
    # streamlit's `<26` at once. Later releases (1.61.1 drops the bound
    # entirely) would also resolve and were not chosen: the dashboard code was
    # written against 1.45.x, and tests/test_package_invariants.py check 6b
    # asserts against a PRIVATE streamlit internal
    # (cache_utils._make_function_key), which is exactly what a sixteen-minor
    # jump breaks.
    "streamlit==1.46.0",
    "plotly==5.24.1",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",

    # --- Orchestration ------------------------------------------------------
    # MOVED OUT OF THE DEFAULT INSTALL to [project.optional-dependencies] as
    # the `orchestration` extra. See the argument there, including the two
    # CRITICALs this does NOT fix.

    # --- Async support ------------------------------------------------------
    "nest-asyncio==1.6.0",

    # --- macOS sleep suppression --------------------------------------------
    # MACOS ONLY, BY ENVIRONMENT MARKER. The old note here said this had to be
    # installed on Linux as well, "because oncotriage/utils.py does an
    # unguarded `import caffeine` at module scope". That has not been true
    # since item 21: the import is inside a `try/except Exception` (Exception,
    # not ImportError -- the failure is a FileNotFoundError from the
    # `caffeinate` subprocess the module body spawns), the reason is recorded
    # in `CAFFEINE_IMPORT_ERROR`, and `CaffeinateSession` prints it and
    # degrades. The comment outlived the fix.
    #
    # WHAT INSTALLING IT ON LINUX ACTUALLY BUYS: nothing, and it costs. The
    # package's last two module-level statements are `on()` and
    # `atexit.register(off)`, and `on()` is
    # `subprocess.Popen(['caffeinate', ...])` -- a macOS binary. So on Linux
    # every `import caffeine` spawns a process that cannot exist, raises, and
    # emits a UserWarning first. That is a process spawn at import time, which
    # is the single thing `tests/test_package_invariants.py` section 2 exists
    # to forbid, and it is why that file had to pre-import caffeine before
    # arming its traps at two separate sites.
    #
    # `sys_platform == "darwin"` is the marker rather than `platform_system`
    # because pip evaluates both and darwin is the value CPython reports on
    # macOS for sys.platform. On Linux the package is simply absent, `_caffeine_mod`
    # is None, and CaffeinateSession says so.
    "caffeine==0.5; sys_platform == 'darwin'",

    # --- Retry / progress ---------------------------------------------------
    "tenacity==9.0.0",

    # --- AWS, for the S3 staging tool -------------------------------------
    # boto3 RATHER THAN THE AWS CLI, and the reason is the secrets refusal.
    # `aws s3 sync --exclude` takes glob patterns, which can express "skip this
    # path" and cannot express "read a bounded prefix of every candidate file,
    # look for nine credential shapes, and refuse the WHOLE run on one hit".
    # That scan has to sit inside the upload path, between the walk and the
    # first PUT, which means the upload has to be a library call.
    #
    # Three lesser reasons, each real: the CLI's exit codes do not distinguish
    # "credential found" from "network failed"; shelling out means parsing
    # human-readable progress output to report transfer stats; and the CLI is a
    # second thing to install and version beside pyproject.toml, which pass
    # 20f-2 spent a whole item making the ONE dependency list.
    #
    # NOTHING IMPORTS IT AT MODULE SCOPE. oncotriage/staging/s3_sync.py defers
    # the import into the functions that need it, so the dry run -- the half
    # that runs today -- works with boto3 absent. That is the same third-party
    # in-a-function-body exemption `import icd10` and `import torch` carry.
    "boto3==1.40.14",

    "tqdm==4.67.1",
]

# NOTES CARRIED OVER FROM THE FILE THIS REPLACES
# ---------------------------------------------------------------------------
# - sqlite3 is built into Python; no pin exists or is needed.
# - On Apple Silicon, torch auto-detects and uses MPS.
# - The container is linux/<host arch> on Python 3.11; the measured environment
#   above is macOS/arm64 on Python 3.13. Same package versions, different
#   interpreter minor. That combination is exercised by item 21's in-container
#   import sweep and by a real POST /match, not assumed.

[project.optional-dependencies]
# ORCHESTRATION — Airflow, and the only other package that exists for it.
#
# THE EXTRA IS A PACKAGING BOUNDARY AND WAS NEVER A FIX. Moving Airflow out of
# the default install narrowed what a default `pip install` resolves, and
# therefore what CI's pip-audit sees; it changed nothing about the code that
# ships. The image installs this extra explicitly (docker-compose.yml runs
# airflow-scheduler and airflow-apiserver from it), so Trivy always saw these
# packages and always reported them. Two of what it reported were CRITICAL:
#
#     CVE-2025-57735  JWT token still valid after logout    fixed 3.2.0
#     CVE-2026-42252  template-engine injection             fixed 3.2.2
#
# BOTH ARE FIXED HERE BY UPGRADING, and the version was measured rather than
# assumed. pip-audit against each candidate release, reading the fix version
# off the advisory rather than off a changelog:
#
#     3.1.7   39 advisories on apache-airflow, 8 on apache-airflow-core
#     3.1.8   30 / 8      — clears neither CRITICAL
#     3.2.0   22 / 1      — clears CVE-2025-57735, not CVE-2026-42252
#     3.2.1   21 / 1
#     3.2.2    5 / 0      — THE LOWEST RELEASE THAT CLEARS BOTH
#     3.3.0    0 / 0
#
# 3.3.0 IS PINNED, NOT 3.2.2, AND THE ONE EXTRA RELEASE IS ARGUED. 3.2.2 is
# the literal answer to "the lowest that clears both", and it still carries
# five advisories that pip-audit reports as fixed in 3.3.0 — CVE-2026-33264,
# CVE-2026-49296, CVE-2026-48891, CVE-2026-48892, CVE-2026-49487. Those five
# are worse than an ordinary accepted finding because NEITHER GATE WOULD EVER
# NAME THEM: this package is outside the default install so CI's pip-audit
# does not see it, and Trivy 0.73.0's database has no entry for any of the
# five (measured — a probe image carrying only an
# `apache_airflow-3.2.2.dist-info/METADATA` reports zero findings, while the
# same probe at 3.1.7 reproduces exactly the eleven ids the old .trivyignore
# listed). Pinning 3.2.2 would therefore ship five known-fixable advisories
# into a pipeline whose stated property is that nothing is accepted silently.
#
# CVE-2026-42252 IS NOT IN pip-audit's DATA AT ALL, under that id or any alias
# of it, at any version. It comes from Trivy, whose advisory carries the fixed
# version 3.2.2. So "determine the version from pip-audit" answers only half
# the question and the two scanners had to be read together; the table above
# is pip-audit's and the 3.2.2 floor for that one CVE is Trivy's.
#
# WHAT THIS UPGRADE DRAGS WITH IT, stated because it is much larger than the
# line it changes: `apache-airflow-core` 3.1.7 declared
# `fastapi[standard-no-fastapi-cloud-cli]<0.118.0,>=0.116.0`, which is why
# `fastapi==0.117.1` was installable beside it. 3.2.2 and 3.3.0 declare
# `>=0.129.0` (3.3.0 also `<0.137.0`). There is no version of Airflow that
# clears both CRITICALs and coexists with the old fastapi pin — the resolver
# refuses outright — so THE AIRFLOW UPGRADE FORCES THE FASTAPI UPGRADE, which
# in turn releases starlette from the cap that made six starlette advisories
# unfixable. See the fastapi pin above for what that cost and cleared.
#
# WHY THESE TWO PACKAGES AND NOTHING ELSE, derived rather than assumed. The
# full dependency closure was resolved twice with pip's own resolver, once with
# apache-airflow and pendulum and once without:
#
#     with    207 packages
#     without 131 packages
#     -> 76 packages exist ONLY because of Airflow
#
# Of those 76, exactly TWO are declared here; the other 74 are transitive and
# follow automatically (alembic, sqlalchemy, the four opentelemetry exporters,
# the six apache-airflow-providers-*, rich, typer, croniter, ...). `pendulum`
# is in that set and nothing else in the closure requires it: it appears in the
# with-Airflow resolution and not in the without-Airflow one, and the project's
# only use of it is the `import pendulum` line INSIDE the generated DAG string
# in oncotriage/orchestration/dag_generator.py, which is executed by Airflow's
# parser in a separate process.
#
# NOTHING IN oncotriage/orchestration/ IMPORTS AIRFLOW, verified by AST rather
# than by grep: dag_generator.py's only imports are pathlib, oncotriage.paths,
# oncotriage.settings, orchestration.home and observability. The `import
# pendulum` and `from airflow.sdk import dag, task` that a grep finds at lines
# 112-113 sit inside a string literal spanning lines 91-121 — the DAG text,
# not this module's imports. airflow_manager.py shells out through subprocess
# and talks to the scheduler over REST; airflow_setup.py shells out to
# `airflow db migrate`. So the package imports, and bucket A passes, with
# Airflow absent.
#
#     pip install -e .                    # pipeline only, no Airflow
#     pip install -e ".[orchestration]"   # adds Airflow, for Files 22/23/24
#
# The Docker image installs this extra explicitly — docker-compose.yml runs
# airflow-scheduler and airflow-apiserver from the same image, and a
# default-only install would leave both without Airflow. See the Dockerfile.
orchestration = [
    "apache-airflow==3.3.0",
    "pendulum==3.2.0",
]

[tool.setuptools.dynamic]
# setuptools reads this attribute from the AST of oncotriage/__init__.py at
# BUILD time — it does not import the package, so nothing here depends on the
# sibling data tree being present. The one requirement it imposes is that
# `__version__` stays a plain string literal assigned at module level in that
# file.
version = {attr = "oncotriage.__version__"}

[tool.setuptools]
# Explicit, not auto-discovered. Auto-discovery over this directory would trip
# over the space-containing scripts beside the package.
#
# EVERY SUBPACKAGE IS LISTED. setuptools does not recurse into a listed package
# for you, so a subpackage added to the tree and not added here is present in an
# editable install (which maps the source tree) and ABSENT from a built wheel.
# That difference would not show up until someone built one.
packages = [
    "oncotriage",
    "oncotriage.registries",
    "oncotriage.extraction",
    "oncotriage.fhir",
    "oncotriage.retrieval",
    "oncotriage.storage",
    "oncotriage.agent",
    # Pass 20c-3b: the serving layer.
    "oncotriage.api",
    "oncotriage.monitoring",
    "oncotriage.batch",
    # Pass 20c-3c-1: the Streamlit dashboard. BOTH levels have to be listed --
    # setuptools does not recurse into a listed package, so declaring only
    # "oncotriage.dashboard" would ship a wheel whose dashboard has no tabs.
    "oncotriage.dashboard",
    "oncotriage.dashboard.tabs",
    # Pass 20c-3c-2: the Airflow orchestration layer (Files 22, 23, 24).
    # File 29 became oncotriage/retrieval/qdrant_backup.py, inside a subpackage
    # already listed above, so it needs no entry here.
    "oncotriage.orchestration",
    # Pass 20c-3d, the last conversion pass: the ablation study and its
    # analysis (Files 26 and 27), the two offline measurements (Files 28 and
    # 34), and the characterization fixture harness (Files 45 and 46).
    "oncotriage.ablation",
    "oncotriage.evaluation",
    "oncotriage.fixtures",
    # The S3 staging pass: the rulings, the secrets refusal, the walk and the
    # AWS half. Listed because setuptools does not recurse into a listed
    # package -- an undeclared subpackage is present in an editable install and
    # ABSENT from a built wheel, and nothing surfaces until somebody builds one.
    "oncotriage.staging",
    # The MCP pass: the stdio Model Context Protocol server. Named
    # `oncotriage.mcp` beside the third-party `mcp` it imports, which is safe
    # because Python 3 resolves imports absolutely; the argument and the check
    # that proves it are in `oncotriage/mcp/__init__.py` and
    # `tests/test_mcp_server_stdio_contract.py`.
    "oncotriage.mcp",
]
